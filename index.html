          <button class="btn-fant" style="padding:2px 6px;color:var(--perigo)" onclick="excluirInsumo('${i.id}')">✕</button></div></div>
        <div class="meta">${esc(i.categoria||"")}${i.categoria?" · ":""}Saldo: <b style="color:${baixo?'#c0392b':'var(--texto)'}">${numFmt(i.saldo)} ${esc(i.unidade||"un")}</b> · ${moeda(i.custoMedio||0)}/${esc(i.unidade||"un")} · ${moeda(vv)}</div>
        <div style="margin-top:8px;display:flex;gap:10px">
          <button class="btn btn-sec" style="margin:0;flex:1" onclick="formEntradaInsumo('${i.id}')">＋ Entrada</button>
          <button class="btn btn-sec" style="margin:0;flex:1" onclick="formConsumoInsumo('${i.id}')">－ Consumo</button>
        </div></div>`;
    }).join(""):`<div class="meta" style="padding:2px 4px 8px">Nenhum item cadastrado neste grupo.</div>`;
    return `<div class="h3">${gic} ${gnome}</div>
      <button class="btn btn-sec" onclick="formNovoInsumo('${gkey}')">+ Novo item</button>
      ${linhas}`;
  };
  $t.innerHTML=`<button class="voltar" onclick="telaPainel()">‹ Gestão Operacional</button>
    <div class="sechead"><span class="sic">📦</span><h2>Estoque de Insumos</h2></div>
    <div class="fin-cards" style="margin-bottom:6px">
      <div class="fin-c"><div class="cl">📦 Valor em estoque</div><div class="cv">${moeda(valorTotal)}</div></div>
      <div class="fin-c"><div class="cl">📌 A pagar (compras)</div><div class="cv">${moeda(aPagarIns)}</div></div>
    </div>
    ${bloco("gado","Insumos do gado","💊")}
    ${bloco("manutencao","Manutenção da propriedade","🔧")}
    <div class="h3">Últimos movimentos</div>
    ${await histEstoque(insumos,movs)}`;
}
async function histEstoque(insumos,movs){
  const nomeIns=id=>(insumos.find(i=>i.id===id)||{}).nome||"item removido";
  const arr=movs.slice().sort((a,b)=>(b.data||"").localeCompare(a.data||"")||(b.criadoEm||0)-(a.criadoEm||0)).map(m=>{
    const ent=m.tipo==="entrada";
    const cor=ent?"var(--verde)":"var(--perigo)";
    const vv=ent?(m.valorTotal||0):((m.qtd||0)*(m.custoUnit||0));
    return `<div class="card"><div class="row"><div class="ti" style="font-size:14px">${ent?"＋":"－"} ${esc(nomeIns(m.insumoId))}</div>
      <div style="font-weight:800;color:${cor};white-space:nowrap">${ent?"":"−"}${moeda(vv)}</div></div>
      <div class="meta">${fmt(m.data)} · ${numFmt(m.qtd)} ${esc(m.unidade||"")}${ent?(m.pago?" · pago":" · a pagar"):""}${m.obs?" · "+esc(m.obs):""}</div>
      <div style="margin-top:4px">${ent&&!m.pago?`<button class="btn-fant" style="padding:2px 8px 2px 0;color:var(--verde);font-weight:600" onclick="pagarEntradaInsumo('${m.id}')">Marcar pago</button>`:""}<button class="btn-fant" style="padding:2px 8px;color:var(--perigo)" onclick="excluirMovInsumo('${m.id}')">Excluir</button></div></div>`;
  });
  return arr.length?verMais(arr,"movimento(s)"):`<div class="meta" style="padding:2px 4px 8px">Sem movimentos ainda.</div>`;
}
async function formNovoInsumo(grupo,editId){
  const ed=editId?await get("insumos",editId):null;
  const g=ed?ed.grupo:(grupo||"gado");
  const cats=catsDoGrupo(g);
  const optCat=cats.map(c=>`<option value="${esc(c)}" ${ed&&ed.categoria===c?"selected":""}>${c}</option>`).join("");
  const optUn=UNID_INSUMO.map(u=>`<option value="${u}" ${ed&&ed.unidade===u?"selected":""}>${u}</option>`).join("");
  abrir(`<h2>${ed?"Editar item":"Novo item de estoque"}</h2>
    <label>Grupo</label><input value="${g==="manutencao"?"Manutenção da propriedade":"Insumos do gado"}" disabled>
    <input type="hidden" id="in_grupo" value="${g}">
    <label>Nome *</label><input id="in_nome" value="${ed?esc(ed.nome||""):""}" placeholder="Ex: Ivermectina 1% / Arame farpado">
    <label>Categoria</label><select id="in_cat">${optCat}</select>
    <label>Unidade</label><select id="in_un">${optUn}</select>
    <div class="lado" style="margin-top:18px"><button class="btn btn-sec" onclick="fechar()">Cancelar</button>
      <button class="btn" onclick="salvarInsumo(${ed?`'${ed.id}'`:""})">Salvar</button></div>`);
}
async function formEditarInsumo(id){formNovoInsumo(null,id);}
async function salvarInsumo(id){
  const nome=val("in_nome"); if(!nome)return alert("Dê um nome ao item.");
  const grupo=val("in_grupo")||"gado", categoria=val("in_cat"), unidade=val("in_un");
  if(id){const it=await get("insumos",id);if(it){it.nome=nome;it.categoria=categoria;it.unidade=unidade;await put("insumos",it);}}
  else await put("insumos",{id:uid(),nome,grupo,categoria,unidade,saldo:0,custoMedio:0,criadoEm:Date.now()});
  fechar();telaEstoque();
}
async function excluirInsumo(id){
  const movs=(await getAll("insumo_mov")).filter(m=>m.insumoId===id);
  if(movs.length)return alert("Este item tem movimentos registrados. Exclua os movimentos antes (ou mantenha o item para o histórico).");
  if(!confirm("Excluir este item de estoque?"))return;
  await del("insumos",id);telaEstoque();
}
async function formEntradaInsumo(id){
  const it=await get("insumos",id); if(!it){telaEstoque();return;}
  abrir(`<h2>Entrada — ${esc(it.nome)}</h2>
    <div class="meta" style="margin-bottom:8px">Saldo atual: <b>${numFmt(it.saldo)} ${esc(it.unidade||"un")}</b> · custo médio ${moeda(it.custoMedio||0)}</div>
    <label>Quantidade (${esc(it.unidade||"un")}) *</label><input id="en_qtd" inputmode="decimal" placeholder="Ex: 10">
    <label>Valor total pago (R$) *</label><input id="en_valor" inputmode="decimal" placeholder="Ex: 250">
    <label>Data</label><input id="en_data" type="date" value="${hoje()}">
    <label>Forma de pagamento</label><select id="en_forma"><option value="vista">À vista</option><option value="prazo">A prazo (fica a pagar)</option></select>
    <label>Observação (opcional)</label><input id="en_obs" placeholder="Ex: nota, fornecedor…">
    <div class="lado" style="margin-top:18px"><button class="btn btn-sec" onclick="fechar()">Cancelar</button>
      <button class="btn" onclick="salvarEntradaInsumo('${id}')">Salvar</button></div>`);
}
async function salvarEntradaInsumo(id){
  const qtd=numBR("en_qtd"), valor=numBR("en_valor");
  if(qtd==null||qtd<=0)return alert("Informe a quantidade.");
  if(valor==null||valor<0)return alert("Informe o valor total.");
  const it=await get("insumos",id); if(!it)return;
  const saldoAnt=it.saldo||0, custoAnt=it.custoMedio||0, novoSaldo=saldoAnt+qtd;
  it.custoMedio=novoSaldo>0?((saldoAnt*custoAnt)+valor)/novoSaldo:0; // média móvel ponderada
  it.saldo=novoSaldo;
  await put("insumos",it);
  const forma=(document.getElementById("en_forma")||{}).value||"vista";
  await put("insumo_mov",{id:uid(),insumoId:id,tipo:"entrada",qtd,unidade:it.unidade||"un",
    valorTotal:valor,pago:forma==="vista",data:val("en_data"),obs:val("en_obs"),criadoEm:Date.now()});
  fechar();telaEstoque();
}
async function pagarEntradaInsumo(movId){
  const m=await get("insumo_mov",movId); if(m){m.pago=true;await put("insumo_mov",m);} telaEstoque();
}
async function formConsumoInsumo(id){
  const it=await get("insumos",id); if(!it){telaEstoque();return;}
  if((it.saldo||0)<=0)return alert("Sem saldo para consumir. Registre uma entrada primeiro.");
  abrir(`<h2>Consumo — ${esc(it.nome)}</h2>
    <div class="meta" style="margin-bottom:8px">Saldo: <b>${numFmt(it.saldo)} ${esc(it.unidade||"un")}</b> · custo médio ${moeda(it.custoMedio||0)}</div>
    <label>Quantidade usada (${esc(it.unidade||"un")}) *</label><input id="co_qtd" inputmode="decimal" placeholder="Ex: 2">
    <label>Data</label><input id="co_data" type="date" value="${hoje()}">
    <label>Onde / para que (opcional)</label><input id="co_obs" placeholder="Ex: lote Maiores, cerca do pasto Serra…">
    <div class="meta" style="margin-top:6px">O valor consumido (custo médio × quantidade) vira <b>despesa</b> do período.</div>
    <div class="lado" style="margin-top:18px"><button class="btn btn-sec" onclick="fechar()">Cancelar</button>
      <button class="btn" onclick="salvarConsumoInsumo('${id}')">Registrar consumo</button></div>`);
}
async function salvarConsumoInsumo(id){
  const qtd=numBR("co_qtd");
  if(qtd==null||qtd<=0)return alert("Informe a quantidade.");
  const it=await get("insumos",id); if(!it)return;
  if(qtd>(it.saldo||0)+1e-9)return alert("Quantidade maior que o saldo ("+numFmt(it.saldo)+" "+(it.unidade||"un")+").");
  const custoUnit=it.custoMedio||0;
  it.saldo=(it.saldo||0)-qtd; await put("insumos",it);
  const data=val("co_data"), obs=val("co_obs"), movId=uid();
  await put("insumo_mov",{id:movId,insumoId:id,tipo:"consumo",qtd,unidade:it.unidade||"un",custoUnit,data,obs,criadoEm:Date.now()});
  const catDesp=DESPESA_DE_INSUMO[it.grupo]||"Outros";
  await put("lancamentos",{id:uid(),tipo:"despesa",categoria:catDesp,valor:qtd*custoUnit,
    data,descricao:`Consumo ${it.nome} (${numFmt(qtd)} ${it.unidade||"un"})`,propriedadeId:null,
    pago:true,origem:"consumo_insumo",refId:movId,criadoEm:Date.now()});
  fechar();telaEstoque();
}
async function excluirMovInsumo(movId){
  const m=await get("insumo_mov",movId); if(!m){telaEstoque();return;}
  if(!confirm("Excluir este movimento? O saldo e o custo médio serão recalculados."))return;
  if(m.tipo==="consumo"){
    const lancs=(await getAll("lancamentos")).filter(l=>l.origem==="consumo_insumo"&&l.refId===movId);
    for(const l of lancs)await del("lancamentos",l.id);
  }
  await del("insumo_mov",movId);
  await reconstruirInsumo(m.insumoId);
  telaEstoque();
}
async function reconstruirInsumo(insumoId){
  const it=await get("insumos",insumoId); if(!it)return;
  const movs=(await getAll("insumo_mov")).filter(m=>m.insumoId===insumoId)
    .sort((a,b)=>(a.data||"").localeCompare(b.data||"")||(a.criadoEm||0)-(b.criadoEm||0));
  let saldo=0, custo=0;
  for(const m of movs){
    if(m.tipo==="entrada"){const ns=saldo+(m.qtd||0);custo=ns>0?((saldo*custo)+(m.valorTotal||0))/ns:0;saldo=ns;}
    else{saldo=Math.max(0,saldo-(m.qtd||0));}
  }
  it.saldo=saldo; it.custoMedio=custo; await put("insumos",it);
}

async function finConfig(){
  if(!(await podeUsarApp("Acessar configurações financeiras")))return;
  topoPagina();
  $t.innerHTML=`${finHead()}${finTabsBar("config")}
    <div class="card"><b>Como as contas funcionam</b>
      <div class="meta" style="margin-top:8px;line-height:1.55">• Regime de <b>competência</b>: cada valor entra na data do fato, não na data do pagamento.<br>
      • <b>Compra de animal</b> não é despesa — vira <b>estoque</b> (ativo) pelo preço de compra.<br>

      • <b>Venda</b>: <b>D</b> Banco/Clientes · <b>C</b> Receita e <b>D</b> CPV · <b>C</b> Estoque. Se o animal era um bezerro nascido, o ganho a realizar é realizado (<b>D</b> Ganho a realizar · <b>C</b> Ganho realizado), e só então vira resultado.<br>
      • <b>Morte</b> de bezerro nascido: estorna (baixa o estoque contra o ganho a realizar), sem tocar no resultado.<br>
      • <b>À vista</b> entra no caixa; <b>a prazo</b> fica em "a receber" (Clientes) até você marcar como recebido.<br>
      • <b>Valor do rebanho</b> = soma do custo de estoque dos animais ativos.</div></div>
    <div class="card"><b>Próxima fase</b><div class="meta" style="margin-top:6px">Capitalizar custos no animal (sanidade, sal) para margem por cabeça/arroba, e recebimento parcelado.</div></div>

}

async function telaGrupos(){
  topoPagina();
  $t.dataset.syncScreen="grupos";
  const {grupos,grupo_animais,animais}=await tudo();
  const ativos=new Set(animais.filter(a=>a.status==="Ativo").map(a=>a.id));
  const conta=gid=>grupo_animais.filter(v=>v.grupoId===gid&&ativos.has(v.animalId)).length;
  let itens=grupos.map(g=>`<div class="card row rt" onclick="verGrupo('${g.id}')">
    <div><div class="ti">👥 ${esc(g.nome)}</div>${g.descricao?`<div class="meta">${esc(g.descricao)}</div>`:""}</div>
    <span class="badge">${conta(g.id)} 🐄</span></div>`).join("");
  $t.innerHTML=`<button class="voltar" onclick="telaLotes()">‹ Lotes</button>
    <div class="sechead"><span class="sic">👥</span><h2>Grupos de animais</h2></div>
    <div class="meta" style="margin:-8px 4px 14px">O lote indica onde o animal está. Grupos são classificações simultâneas e não alteram o lote atual.</div>
    <button class="btn" onclick="formNovoGrupo()">+ Novo grupo</button>
    ${itens||`<div class="vazio"><div class="big">👥</div><b>Nenhum grupo</b><div class="meta">Crie grupos para reunir animais por finalidade, protocolo ou categoria.</div></div>`}`;
}

async function verGrupo(id){
  topoPagina();
  $t.dataset.syncScreen="grupo:"+id;
  const g=await get("grupos",id);if(!g)return telaGrupos();
  const {animais,lotes,grupo_animais}=await tudo();
  const ids=new Set(grupo_animais.filter(v=>v.grupoId===id).map(v=>v.animalId));
  const membros=animais.filter(a=>ids.has(a.id)&&a.status==="Ativo");
  const nomeLote=lid=>(lotes.find(l=>l.id===lid)||{}).nome||"—";
  const itens=membros.map(a=>`<div class="card row">
    <div class="rt" style="flex:1" onclick="verAnimal('${a.id}')"><div class="ti">${esc(rotulo(a))} <span class="chip chip-id">${codAnimal(a)}</span></div><div class="meta">▦ ${esc(nomeLote(a.loteAtualId))}</div></div>
    <button class="btn-fant" style="padding:5px 8px;color:var(--perigo)" onclick="removerAnimalGrupo('${id}','${a.id}')">✕</button></div>`).join("");
  $t.innerHTML=`<button class="voltar" onclick="telaGrupos()">‹ Grupos</button>
    <div class="card"><div class="ti" style="font-size:20px">👥 ${esc(g.nome)}</div>${g.descricao?`<div class="meta">${esc(g.descricao)}</div>`:""}<div class="meta" style="margin-top:5px">${membros.length} animal(is) ativo(s)</div></div>

    <div class="lado"><button class="btn btn-sec" onclick="formNovoGrupo('${id}')">✎ Editar grupo</button><button class="btn btn-perigo" onclick="excluirGrupo('${id}')">Excluir grupo</button></div>
    <div class="h3">Animais do grupo</div>${itens||`<div class="meta">Nenhum animal neste grupo.</div>`}`;
}
async function adicionarAnimaisGrupo(grupoId){
  const animais=(await getAll("animais")).filter(a=>a.status==="Ativo");
  const vinculos=await getAll("grupo_animais");
  const ja=new Set(vinculos.filter(v=>v.grupoId===grupoId).map(v=>v.animalId));
  const disp=animais.filter(a=>!ja.has(a.id));
  if(!disp.length)return alert("Todos os animais ativos já pertencem a este grupo.");
  const opts=disp.map(a=>`<label style="display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--linha);padding:11px 2px;margin:0;color:var(--texto)"><input type="checkbox" class="ga_ck" value="${a.id}" style="width:20px;height:20px"> <span>${esc(rotulo(a))} ${codAnimal(a)}</span></label>`).join("");
  abrir(`<h2>Adicionar ao grupo</h2><div class="meta" style="margin-bottom:10px">Selecione um ou vários animais.</div>${opts}
    <div class="lado" style="margin-top:18px"><button class="btn btn-sec" onclick="fechar()">Cancelar</button><button class="btn" onclick="salvarAnimaisGrupo('${grupoId}')">Adicionar</button></div>`);
}
async function salvarAnimaisGrupo(grupoId){
  const ids=[...document.querySelectorAll(".ga_ck:checked")].map(x=>x.value);
  if(!ids.length)return alert("Selecione pelo menos um animal.");
  const existentes=await getAll("grupo_animais");
  for(const animalId of ids){
    if(existentes.some(v=>v.grupoId===grupoId&&v.animalId===animalId))continue;
    await put("grupo_animais",{id:uid(),grupoId,animalId,criadoEm:Date.now()});
  }
  fechar();verGrupo(grupoId);
}
async function removerAnimalGrupo(grupoId,animalId){
  const v=(await getAll("grupo_animais")).find(x=>x.grupoId===grupoId&&x.animalId===animalId);if(!v)return;
  await del("grupo_animais",v.id);verGrupo(grupoId);
}
async function excluirGrupo(id){
  const g=await get("grupos",id);if(!g)return;
  if(!confirm(`Excluir o grupo "${g.nome}"? Os animais não serão apagados.`))return;
  const vs=(await getAll("grupo_animais")).filter(v=>v.grupoId===id);
  for(const v of vs)await del("grupo_animais",v.id);
  await del("grupos",id);telaGrupos();
}
async function gerenciarGruposAnimal(animalId){
  const a=await get("animais",animalId);if(!a)return;
  const grupos=await getAll("grupos"),vinculos=await getAll("grupo_animais");
  if(!grupos.length){
    abrir(`<h2>👥 Grupos — ${esc(rotulo(a))}</h2><div class="meta">Nenhum grupo foi criado ainda.</div><button class="btn" style="margin-top:16px" onclick="fechar();formNovoGrupo()">+ Criar primeiro grupo</button><button class="btn-fant" onclick="fechar()">Fechar</button>`);return;
  }
  const meus=new Set(vinculos.filter(v=>v.animalId===animalId).map(v=>v.grupoId));
  const opts=grupos.map(g=>`<label style="display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--linha);padding:11px 2px;margin:0;color:var(--texto)"><input type="checkbox" class="ag_ck" value="${g.id}" ${meus.has(g.id)?"checked":""} style="width:20px;height:20px"> <span><b>${esc(g.nome)}</b>${g.descricao?`<span class="meta" style="display:block">${esc(g.descricao)}</span>`:""}</span></label>`).join("");
  abrir(`<h2>👥 Grupos — ${esc(rotulo(a))}</h2><div class="meta" style="margin-bottom:10px">O animal pode pertencer a vários grupos ao mesmo tempo. O lote atual não será alterado.</div>${opts}
    <div class="lado" style="margin-top:18px"><button class="btn btn-sec" onclick="fechar()">Cancelar</button><button class="btn" onclick="salvarGruposDoAnimal('${animalId}')">Salvar</button></div>`);
}
async function salvarGruposDoAnimal(animalId){
  const selecionados=new Set([...document.querySelectorAll(".ag_ck:checked")].map(x=>x.value));
  const vinculos=(await getAll("grupo_animais")).filter(v=>v.animalId===animalId);
  const atuais=new Set(vinculos.map(v=>v.grupoId));
  for(const v of vinculos)if(!selecionados.has(v.grupoId))await del("grupo_animais",v.id);
  for(const grupoId of selecionados)if(!atuais.has(grupoId))await put("grupo_animais",{id:uid(),grupoId,animalId,criadoEm:Date.now()});
  fechar();verAnimal(animalId);
}

async function formEditarPasto(id){

async function salvarEdicaoPasto(id){
  const nome=val("pe_nome");if(!nome)return alert("Dê um nome ao pasto.");
  const pt=await get("pastos",id);
  const novoStatus=val("pe_status");
  const novoLote=novoStatus==="Ocupado"?(val("pe_lote")||null):null;
  // garante os campos de histórico em pastos antigos
  if(!pt.historico)pt.historico=[];
  if(pt.statusDesde==null)pt.statusDesde=pt.criadoEm||Date.now();
  // se a situação mudou, fecha o período atual e abre um novo
  if(novoStatus!==(pt.status||"Livre")){
    pt.historico.push({status:pt.status||"Livre",inicio:pt.statusDesde,fim:Date.now(),loteId:pt.loteId||null});
    pt.statusDesde=Date.now();
  }
  pt.propriedadeId=val("pe_prop");pt.nome=nome;pt.areaHa=numBR("pe_area");pt.tipoCapim=val("pe_capim");
  pt.status=novoStatus;pt.loteId=novoLote;
  await put("pastos",pt);fechar();telaGestaoPasto();
}
async function excluirPasto(id){
  const pt=await get("pastos",id);
  if(!confirm(`Apagar o pasto "${pt?pt.nome:""}"?`))return;
  await del("pastos",id);fechar();telaGestaoPasto();
}

async function salvarAnimal(nascimento){
  const nasceu = nascimento || ((document.getElementById("a_nasceu")||{}).value==="sim");
  const maeId = nasceu ? (val("a_mae")||null) : null;

  const a={id:uid(),codigo:await proximoCodigo(),
    brinco,nome:val("a_nome"),sexo:val("a_sexo"),
    nascidoNaPropriedade:!!nasceu,

async function salvarSaida(animalId){
  const id = animalId || (document.getElementById("s_animal")||{}).value;
  if(!id)return alert("Selecione o animal.");
  const tipo=val("s_tipo"), data=val("s_data"), hora=val("s_hora");
  let saida={tipo,data,hora}, det="";
  if(tipo==="Morte"){
    saida.causa=val("s_causa");
    det=`Causa: ${saida.causa||"não informada"}`;
  }else{
    const preco=numBR("s_preco"), bruto=numBR("s_bruto"), liq=numBR("s_liq"), cond=val("s_cond");
    const valorInformado=numBR("s_valor");
    const valorCalc=(preco!=null&&liq!=null)?preco*(liq/15):null;
    const valor=valorInformado!=null?valorInformado:valorCalc;
    saida={...saida,precoArroba:preco,pesoBruto:bruto,pesoLiquido:liq,condicoes:cond,valor};
    det=`@ ${preco!=null?moeda(preco):"—"} · bruto ${bruto??"—"}kg · líq ${liq??"—"}kg`+
        (valor!=null?` · total ${moeda(valor)}`:"")+(cond?` · ${cond}`:"");
  }
  await registrarEvento(id,tipo,data,det,{hora});   // já muda o status para Morto/Vendido
  const a=await get("animais",id); a.saida=saida; await put("animais",a);
  // Integração financeira: venda gera receita (competência) + CPV / baixa de estoque
  if(tipo==="Venda"&&saida.valor!=null){
    const forma=(document.getElementById("s_forma")||{}).value||"vista";
    const lote=a.loteAtualId?await get("lotes",a.loteAtualId):null;
    await put("lancamentos",{id:uid(),tipo:"receita",categoria:"Venda de animais",valor:saida.valor,
      custo:a.custoEstoque||0, formaRecebimento:forma,
      ganhoRealizado: a.nascidoNaPropriedade===true ? (a.custoEstoque||0) : 0,
      data,descricao:`Venda ${rotulo(a)} ${codAnimal(a)}`,propriedadeId:lote?lote.propriedadeId:null,
      pago:forma==="vista",origem:"venda_animal",refId:id,criadoEm:Date.now()});
  }
  fechar(); irAba('animais');
}

async function telaManejo(){
  if(!(await podeUsarApp("Acessar manejo")))return;
  topoPagina();
  const {animais,eventos,medicamentos}=await tudo();
  const nomeAnimal=id=>{const a=animais.find(x=>x.id===id);return a?`${rotulo(a)} ${codAnimal(a)}`:"Animal não encontrado";};
  const nomeMed=id=>{const m=medicamentos.find(x=>x.id===id);return m?m.nome:"Medicamento não informado";};
  const gruposManejo=(tipo)=>{
    const evs=eventos.filter(e=>e.tipo===tipo).sort((a,b)=>(b.data||"").localeCompare(a.data||"")||(b.hora||"").localeCompare(a.hora||"")||(b.criadoEm||0)-(a.criadoEm||0));
    const mapa=new Map();
    for(const e of evs){
      const chave=[e.tipo,e.data||"",e.hora||"",e.detalhes||"",e.medicamentoId||"",e.via||"",e.dose||""].join("|");
      if(!mapa.has(chave))mapa.set(chave,{...e,animalIds:[],eventoIds:[]});
      const g=mapa.get(chave);g.animalIds.push(e.animalId);g.eventoIds.push(e.id);
    }
    return [...mapa.values()];
  };
  const sec=(tipo,icone,titulo)=>{
    const grupos=gruposManejo(tipo);
    if(!grupos.length)return `<div class="manejo-sec"><div class="manejo-sec-head"><div class="manejo-sec-title">${icone} ${titulo}</div><span class="manejo-count">0</span></div><div class="meta">Nenhum registro ainda.</div></div>`;
    const regsArr=grupos.map(g=>{
      const nomes=g.animalIds.map(nomeAnimal);
      const quem=nomes.length<=3?nomes.map(esc).join(", "):`${nomes.slice(0,3).map(esc).join(", ")} +${nomes.length-3}`;
      let tituloReg="";
      let detalhe="";
      if(tipo==="Medicamento"){
        tituloReg=esc(nomeMed(g.medicamentoId));
        detalhe=[g.via?`Via: ${esc(g.via)}`:"",g.dose?`Dose: ${esc(g.dose)}`:"",g.detalhes?esc(g.detalhes):""].filter(Boolean).join(" · ");
      }else if(tipo==="Marcação"){
        tituloReg="Marcação realizada";
        detalhe=g.detalhes?esc(g.detalhes):"Sem observação";
      }else if(tipo==="Castração"){
        tituloReg="Castração";
        detalhe=g.detalhes?esc(g.detalhes):"";
      }else if(tipo==="Outro"){
        tituloReg=esc(g.detalhes||"Outro evento");
      }else{
        tituloReg=esc(g.detalhes||tipo);
      }
      const quando=`${fmt(g.data)}${g.hora?` · ${esc(g.hora)}`:""}`;
      const ctrl=tipo!=="Movimentação"?`<div style="margin-top:8px">
        <button class="btn-fant" style="padding:2px 10px 2px 0;color:var(--verde);font-weight:600" onclick="editarGrupoManejo('${tipo}','${g.eventoIds.join(",")}')">✎ Editar</button>
        <button class="btn-fant" style="padding:2px 6px;color:var(--perigo)" onclick="excluirGrupoManejo('${tipo}','${g.eventoIds.join(",")}')">✕ Excluir</button></div>`:"";
      return `<div class="manejo-reg"><div class="mr-top"><div class="mr-title">${tituloReg}</div><div class="mr-date">${quando}</div></div><div class="mr-meta">${quem}${detalhe?`<br>${detalhe}`:""}</div>${ctrl}</div>`;
    });
    return `<div class="manejo-sec"><div class="manejo-sec-head"><div class="manejo-sec-title">${icone} ${titulo}</div><span class="manejo-count">${grupos.length}</span></div>${verMais(regsArr,"registro(s)")}</div>`;
  };
  $t.innerHTML=`<button class="voltar" onclick="irAba('painel')">‹ Gestão Operacional</button>
    <div class="sechead"><span class="sic">☑</span><h2>Manejo</h2></div>
    <div class="meta" style="margin:0 4px 14px">Escolha a ação e depois selecione em quais animais ela será registrada.</div>
    <div class="mod-list">
    ${mod("🔥","Marcar animais","Registrar marcação (ferro).","formManejo('Marcação')")}
    ${mod("💊","Medicamento aplicado","Vacinas, injeção, pour on, spray, brinco, ingestão…","telaMedicamentosManejo()")}
    ${mod("↷","Trocar de lote","Selecione vários animais e mova todos de uma vez.","telaTrocaLote()")}
    ${mod("✂️","Outros","Castração e outros eventos de manejo.","formManejo('Outros')")}
    </div>
    <div class="manejo-hist">
      <div class="sechead"><span class="sic">🗂</span><h2>Histórico de manejo</h2></div>
      ${sec("Medicamento","💊","Medicações realizadas")}
      ${sec("Marcação","🔥","Marcações de animais")}
      ${sec("Movimentação","↷","Trocas de lote")}
      ${sec("Castração","✂️","Castrações")}
      ${sec("Outro","📌","Outros eventos")}
    </div>`;
}

function alternarPainelMedicamentos(painel){
  const aplicacao=document.getElementById("mp_painel_aplicacao");
  const cadastro=document.getElementById("mp_painel_cadastro");
  if(!aplicacao||!cadastro)return;
  const alvo=painel==="aplicacao"?aplicacao:cadastro;
  const outro=painel==="aplicacao"?cadastro:aplicacao;
  const abrir=alvo.style.display==="none";
  outro.style.display="none";
  alvo.style.display=abrir?"block":"none";
  if(abrir)setTimeout(()=>alvo.scrollIntoView({behavior:"smooth",block:"start"}),50);
}
function toggleAlvoMedicamentoPagina(){
  const lote=(document.getElementById("mp_alvo")||{}).value==="lote";
  const ga=document.getElementById("mp_grp_animal"),gl=document.getElementById("mp_grp_lote");
  if(ga)ga.style.display=lote?"none":"block";
  if(gl)gl.style.display=lote?"block":"none";
}
async function salvarMedicamentoManejoPagina(){
  const medId=(document.getElementById("mp_med")||{}).value;
  if(!medId)return alert("Cadastre e selecione o medicamento ou vacina.");
  const alvo=(document.getElementById("mp_alvo")||{}).value||"animal";
  const todos=await getAll("animais");
  let lista=[];
  if(alvo==="animal"){
    const id=(document.getElementById("mp_animal")||{}).value;
    if(!id)return alert("Selecione o animal.");
    lista=[id];
  }else{
    const loteId=(document.getElementById("mp_lote")||{}).value;
    if(!loteId)return alert("Selecione o lote.");
    lista=todos.filter(a=>a.loteAtualId===loteId&&a.status==="Ativo").map(a=>a.id);
    if(!lista.length)return alert("Esse lote não tem animais ativos.");
  }
  const data=val("mp_data"),hora=val("mp_hora"),via=val("mp_via"),dose=val("mp_dose"),obs=val("mp_obs");
  for(const id of lista)await registrarEvento(id,"Medicamento",data,obs,{hora,medicamentoId:medId,via,dose});
  alert(`Aplicação registrada em ${lista.length} animal(is).`);
  telaMedicamentosManejo();
}
async function salvarMedicamentoPagina(){
  const nome=val("mp_novo_nome");
  if(!nome)return alert("Informe o nome do medicamento.");
  await put("medicamentos",{id:uid(),nome,tipo:val("mp_novo_tipo"),fabricante:val("mp_novo_fab"),marca:val("mp_novo_marca"),obs:val("mp_novo_obs")});
  alert("Medicamento cadastrado com sucesso.");
  telaMedicamentosManejo();
}
async function excluirMedicamentoPagina(id){
  const m=await get("medicamentos",id);
  if(!confirm(`Excluir o medicamento "${m?m.nome:""}"?`))return;
  await del("medicamentos",id);
  telaMedicamentosManejo();
}

function atualizarSelecaoTroca(){
  const n=checksTroca().filter(c=>c.checked).length;

}

async function salvarTrocaMultipla(){
  const ids=checksTroca().filter(c=>c.checked).map(c=>c.value);
  if(!ids.length)return alert("Selecione pelo menos um animal.");
  const destino=val("tl_destino");
  if(!destino)return alert("Selecione o lote de destino.");
  const data=val("tl_data"),hora=val("tl_hora");
  const lotes=await getAll("lotes");
  const nomeLote=id=>(lotes.find(l=>l.id===id)||{}).nome||"—";
  const nomeDest=nomeLote(destino);
  let movidos=0,jaEstavam=0;
  for(const id of ids){
    const a=await get("animais",id);if(!a)continue;
    if(a.loteAtualId===destino){jaEstavam++;continue;}
    const de=nomeLote(a.loteAtualId);
    a.loteAtualId=destino;await put("animais",a);
    await registrarEvento(id,"Movimentação",data,`De "${de}" para "${nomeDest}"`,{hora});
    movidos++;
  }
  if(!movidos)return alert("Os animais selecionados já pertencem ao lote de destino.");
  alert(`${movidos} animal(is) movido(s) para ${nomeDest}.${jaEstavam?` ${jaEstavam} já estava(m) nesse lote.`:""}`);
  telaTrocaLote();
}

async function salvarManejo(tipo){
  const alvo=document.getElementById("mj_alvo").value;
  const data=val("mj_data"), hora=val("mj_hora");
  const todos=await getAll("animais");
  let lista=[];
  if(alvo==="animal"){
    const id=(document.getElementById("mj_animal")||{}).value;
    if(!id)return alert("Selecione o animal.");
    lista=[id];
  }else if(alvo==="varios"){
    lista=[...document.querySelectorAll(".mj_multi_ck:checked")].map(c=>c.value);
    if(!lista.length)return alert("Selecione pelo menos um animal.");
  }else if(alvo==="grupo"){
    const grupoId=(document.getElementById("mj_grupo")||{}).value;
    if(!grupoId)return alert("Selecione o grupo.");
    const vinculos=await getAll("grupo_animais");
    const ativos=new Set(todos.filter(a=>a.status==="Ativo").map(a=>a.id));
    lista=[...new Set(vinculos.filter(v=>v.grupoId===grupoId&&ativos.has(v.animalId)).map(v=>v.animalId))];
    if(!lista.length)return alert("Esse grupo não tem animais ativos.");
  }else{
    const loteId=(document.getElementById("mj_lote")||{}).value;
    lista=todos.filter(a=>a.loteAtualId===loteId&&a.status==="Ativo").map(a=>a.id);
    if(!lista.length)return alert("Esse lote não tem animais ativos.");
  }
  let n=0;
  if(tipo==="Movimentação"){
    const destino=val("mj_destino");
    const lotes=await getAll("lotes");
    const nomeLote=id=>(lotes.find(l=>l.id===id)||{}).nome||"—";
    const nomeDest=nomeLote(destino);
    for(const id of lista){
      const a=await get("animais",id);
      if(a.loteAtualId===destino)continue;
      const de=nomeLote(a.loteAtualId);
      a.loteAtualId=destino;await put("animais",a);
      await registrarEvento(id,"Movimentação",data,`De "${de}" para "${nomeDest}"`,{hora});n++;
    }
    if(!n){fechar();return alert("Os animais já estão nesse lote.");}
  }else if(tipo==="Marcação"){
    const obs=val("mj_obs");
    for(const id of lista){await registrarEvento(id,"Marcação",data,obs,{hora});n++;}
  }else if(tipo==="Medicamento"){
    const medId=(document.getElementById("mj_med")||{}).value||null;
    const via=val("mj_via"), dose=val("mj_dose"), obs=val("mj_obs");
    for(const id of lista){await registrarEvento(id,"Medicamento",data,obs,{hora,medicamentoId:medId,via,dose});n++;}
  }else if(tipo==="Outros"){
    const sub=(document.getElementById("mj_sub")||{}).value||"Castração";
    const obs=val("mj_obs");
    if(sub==="Castração"){
      for(const id of lista){const a=await get("animais",id);if(!a||a.sexo!=="M")continue;a.castrado=true;a.dataCastracao=data;await put("animais",a);await registrarEvento(id,"Castração",data,obs,{hora});n++;}
      if(!n){fechar();return alert("Nenhum macho entre os selecionados para castrar.");}
    }else{
      const qual=val("mj_qual");if(!qual)return alert("Descreva qual foi o evento.");
      const det=[qual,obs].filter(Boolean).join(" · ");
      for(const id of lista){await registrarEvento(id,"Outro",data,det,{hora});n++;}
    }
  }
  fechar();render();alert(`Registrado em ${n} animal(is).`);
}

async function salvarGrupoManejo(tipo,idsCsv){
  const ids=idsCsv.split(",");
  const patch={data:val("em_data"),hora:val("em_hora")};
  if(tipo==="Medicamento"){
    patch.medicamentoId=(document.getElementById("em_med")||{}).value||null;
    patch.via=val("em_via");patch.dose=val("em_dose");patch.detalhes=val("em_obs");
  }else if(tipo==="Outro"){
    const det=val("em_det");if(!det)return alert("Descreva o evento.");patch.detalhes=det;
  }else{
    patch.detalhes=val("em_obs");
  }
  for(const id of ids){const e=await get("eventos",id);if(!e)continue;Object.assign(e,patch);await put("eventos",e);}
  fechar();telaManejo();
}
async function excluirGrupoManejo(tipo,idsCsv){
  const ids=idsCsv.split(",");
  if(!confirm(`Excluir este registro? Ele será removido de ${ids.length} animal(is).`))return;
  for(const id of ids)await del("eventos",id);
  telaManejo();
}

/* ======================= BACKUP ======================= */
async function dadosBackup(){
  const d={versao:6,exportadoEm:new Date().toISOString(),syncSchemaVersion:SYNC_SCHEMA_VERSION};
  // Preserva também tombstones e metadados necessários à futura sincronização.
  for(const s of DATA_STORES)d[s]=await getAllRaw(s);
  return d;
}
async function exportar(){
  const d=await dadosBackup();
  const b=new Blob([JSON.stringify(d,null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download=`rebanho-backup-${hoje()}.json`;a.click();URL.revokeObjectURL(u);
  await marcarBackup();
}
/* --- Config / controle de backup --- */
async function getConfig(){return (await get("perfil","config"))||{id:"config"};}
async function marcarBackup(){const c=await getConfig();c.id="config";c.ultimoBackup=Date.now();await put("perfil",c);}
const diasDesde=ts=>ts?Math.floor((Date.now()-ts)/86400000):null;
async function salvarFreq(v){const c=await getConfig();c.id="config";c.lembreteDias=parseInt(v,10)||7;await put("perfil",c);}
/* --- Salvar na nuvem: abre o compartilhamento do iPhone (Salvar em Arquivos → iCloud) --- */
async function salvarNuvem(){
  const d=await dadosBackup();
  const blob=new Blob([JSON.stringify(d,null,2)],{type:"application/json"});
  const file=new File([blob],`rebanho-backup-${hoje()}.json`,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file],title:"Backup do Rebanho"});
      await marcarBackup(); _lembreteOculto=true;
      if(aba==="perfil")telaPerfil(); else if(aba==="painel")telaPainel();
    }catch(e){/* usuário cancelou o compartilhamento */}
  }else{
    await exportar(); _lembreteOculto=true;
    alert("Seu navegador não abre o compartilhamento de arquivos. O backup foi baixado — mova para o iCloud Drive pelo app Arquivos.");
  }
}
async function restaurarDadosBackup(d,pedirConfirmacao=true){
  if(!d||typeof d!=="object")throw new Error("Backup inválido.");
  if(pedirConfirmacao&&!confirm("Importar substitui TODOS os dados atuais. Continuar?"))return false;
  for(const s of DATA_STORES){
    for(const it of await getAllRaw(s))await hardDel(s,it.id);
    for(const original of(d[s]||[])){
      const it={...original}, agora=agoraISO();
      if(!it.created_at)it.created_at=agora;
      if(!it.updated_at)it.updated_at=it.created_at;
      if(it.deleted_at===undefined)it.deleted_at=null;
      if(SYNC_STORES.includes(s)){
        const org=await activeOrgIdLocal();
        if(org)it.organization_id=org;
        it.sync_status="pending_create";
      }else if(!it.sync_status)it.sync_status="pending_create";
      if(!Number.isFinite(it.sync_version))it.sync_version=1;
      await putRaw(s,it);
    }
  }
  return true;
}
function importar(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=async()=>{try{
    const d=JSON.parse(r.result);
    const ok=await restaurarDadosBackup(d,true); if(!ok)return;
    alert("Backup importado.");renderSeguro();
  }catch(e){alert("Arquivo inválido.");}};r.readAsText(f);}
