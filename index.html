<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rebanho">
<meta name="theme-color" content="#1F5130">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>Gestão do Rebanho</title>
<style>
  :root{
    --verde:#2E8B4F;         /* verde de acento (ícones, títulos de seção) */
    --verde-esc:#1F5130;     /* verde escuro (hero, texto forte) */
    --verde-med:#3AA05C;
    --verde-lite:#E8F3EA;    /* fundo claro dos módulos/ícones */
    --verde-lite2:#DCEEDF;
    --fundo:#F6F8F6;
    --card:#FFFFFF;
    --texto:#1A1D1A;
    --muted:#7C837C;
    --linha:#E6EAE6;
    --perigo:#B4432E;
    --sombra:0 1px 3px rgba(20,40,25,.06),0 1px 2px rgba(20,40,25,.04);
    --radius:16px;
    --nav-h:66px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  html{background:var(--fundo);min-height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--fundo);color:var(--texto);font-size:16px;line-height:1.4;
    min-height:100vh;
    padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Topo ---------- */
  .topo{
    background:#fff;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    display:grid;
    grid-template-columns:44px 1fr 44px;
    align-items:center;
    position:sticky;top:0;z-index:20;
    border-bottom:1px solid var(--linha);
  }
  /* Antes do login: só a tela de login aparece — topo e menu somem por completo. */
  body.deslogado .topo,
  body.deslogado nav{display:none!important;}
  body.deslogado main#tela{padding-bottom:24px;}
  .topo .icobtn{
    width:44px;height:44px;border-radius:12px;background:none;color:var(--verde-esc);font-size:22px;
    display:flex;align-items:center;justify-content:center;padding:0;line-height:1;
  }
  .topo .tit{text-align:center;}
  .topo .tit h1{margin:0;font-size:19px;font-weight:800;color:var(--verde-esc);}
  .topo .tit .sub{font-size:12px;color:var(--muted);margin-top:1px;}
  .topo .mais{
    width:44px;height:44px;border-radius:50%;background:var(--verde);color:#fff;font-size:26px;
    box-shadow:var(--sombra);display:flex;align-items:center;justify-content:center;padding:0;line-height:1;
  }
  .topo .mais:active{background:var(--verde-med);}

  main{max-width:660px;margin:0 auto;padding:16px 14px 8px;overflow-x:hidden;}
  #tela > *{animation:telaIn .17s ease-out both;}
  @keyframes telaIn{from{opacity:0}to{opacity:1}}

  /* ---------- Hero ---------- */
  .hero{
    background:linear-gradient(135deg,#245e38 0%,#1c4a2c 55%,#173f26 100%);
    border-radius:20px;padding:20px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--sombra);
    margin-bottom:22px;
  }
  .hero .cattle{position:absolute;right:-10px;bottom:-14px;opacity:.16;width:180px;height:auto;}
  .hero .cabeca{display:flex;align-items:center;gap:12px;}
  .hero .tile{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.14);
    display:flex;align-items:center;justify-content:center;}
  .hero .rot{font-size:15px;font-weight:600;opacity:.95;}
  .hero .num{font-size:52px;font-weight:800;line-height:1;margin:6px 0 2px;}
  .hero .peq{font-size:14px;opacity:.85;}
  .hero .linha{display:flex;align-items:center;gap:14px;margin-top:14px;border-top:1px solid rgba(255,255,255,.18);padding-top:12px;}
  .hero .frase{font-size:12.5px;opacity:.9;line-height:1.5;}
  .hero .assinatura{position:absolute;right:18px;top:16px;font-style:italic;font-size:13px;opacity:.85;text-align:right;max-width:120px;}

  /* ---------- Seções ---------- */
  .sechead{display:flex;align-items:center;gap:8px;margin:0 4px 12px;}
  .sechead .sic{color:var(--verde);font-size:20px;}
  .sechead h2{margin:0;font-size:19px;font-weight:800;color:var(--verde-esc);flex:1;}
  .sechead a{color:var(--verde);font-size:14px;font-weight:600;text-decoration:none;}

  /* ---------- Cartão de propriedade ---------- */
  .prop{background:#fff;border-radius:var(--radius);box-shadow:var(--sombra);padding:12px;margin-bottom:12px;cursor:pointer;}
  .prop:active{background:#fafbfa;}
  .prop .top{display:flex;gap:12px;align-items:center;}
  .prop .thumb{width:80px;height:64px;border-radius:12px;flex-shrink:0;
    background:linear-gradient(160deg,#cfe6d4,#a9d3b3);display:flex;align-items:center;justify-content:center;color:#2c6b41;overflow:hidden;}
  .prop .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .prop-foto-wrap{position:relative;width:92px;height:78px;flex-shrink:0;cursor:pointer;}
  .prop-foto{width:92px;height:78px;border-radius:14px;background:linear-gradient(160deg,#cfe6d4,#a9d3b3);
    display:flex;align-items:center;justify-content:center;color:#2c6b41;font-size:30px;overflow:hidden;}
  .prop-foto img{width:100%;height:100%;object-fit:cover;display:block;}
  .prop-foto-cam{position:absolute;right:-5px;bottom:-5px;width:28px;height:28px;border-radius:50%;
    background:var(--verde);color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;
    font-size:13px;box-shadow:var(--sombra);}
  .prop .nome{font-size:18px;font-weight:700;color:var(--verde-esc);}
  .prop .loc{font-size:13px;color:var(--muted);margin-top:2px;}
  .prop .chev{color:var(--muted);font-size:20px;}
  .prop .stats{display:flex;align-items:stretch;gap:12px;background:#f4f8f4;border-radius:12px;padding:10px 12px;margin-top:10px;}
  .prop .stats .tot{padding-right:12px;border-right:1px solid var(--linha);}
  .prop .stats .lbl{font-size:11px;color:var(--muted);}
  .prop .stats .big{font-size:24px;font-weight:800;color:var(--verde-esc);}
  .prop .marcas{display:flex;gap:16px;flex:1;}
  .prop .marcas .m{text-align:center;}
  .prop .marcas .ms{font-size:11px;color:var(--muted);font-weight:700;}
  .prop .marcas .mn{font-size:18px;font-weight:800;color:var(--verde-esc);}

  /* ---------- Módulos ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .mod-list{display:flex;flex-direction:column;gap:22px;margin-bottom:6px;}
  .filtros-animais{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
  .filtros-animais select{font-size:15px;padding:10px 12px;}
  .mod{background:var(--verde-lite);border-radius:var(--radius);padding:14px;cursor:pointer;position:relative;}
  .mod:active{background:var(--verde-lite2);}
  .mod .mic{width:44px;height:44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
    color:var(--verde);font-size:22px;margin-bottom:10px;box-shadow:var(--sombra);}
  .mod .mt{font-weight:700;color:var(--verde-esc);font-size:15px;}
  .mod .md{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.35;}
  .mod .chev{position:absolute;right:12px;top:14px;color:var(--verde);opacity:.6;}

  /* ---------- Ações de medicamentos ---------- */
  .med-acoes{display:flex;flex-direction:column;gap:12px;margin:4px 0 20px;}
  .med-acao-btn{width:100%;min-height:78px;border:1.7px solid var(--verde);border-radius:16px;background:#fff;color:var(--verde-esc);padding:13px 16px;display:flex;align-items:center;gap:13px;text-align:left;cursor:pointer;font:inherit;box-shadow:0 2px 7px rgba(25,80,45,.06);}
  .med-acao-btn:active{background:var(--verde-lite);transform:scale(.995);}
  .med-acao-ico{width:46px;height:46px;flex:0 0 46px;border-radius:50%;background:var(--verde-lite);display:flex;align-items:center;justify-content:center;font-size:24px;}
  .med-acao-conteudo{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1;}
  .med-acao-conteudo strong{font-size:17px;line-height:1.2;color:var(--verde-esc);}
  .med-acao-conteudo small{font-size:12.5px;line-height:1.3;color:var(--muted);font-weight:500;}
  .med-acao-seta{font-size:28px;line-height:1;color:var(--verde);flex:0 0 auto;}

  .faixa{background:#eef4ef;border-radius:var(--radius);padding:14px 16px;margin-top:18px;display:flex;align-items:center;gap:12px;}
  .faixa .fic{color:var(--verde);font-size:22px;}
  .faixa .ft{font-size:13.5px;color:#3a4a3d;line-height:1.4;}

  /* ---------- Listas genéricas ---------- */
  .card{background:#fff;border-radius:var(--radius);box-shadow:var(--sombra);padding:14px;margin-bottom:10px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .rt{cursor:pointer;} .rt:active{background:#fafbfa;}
  .ti{font-weight:600;font-size:16px;} .meta{color:var(--muted);font-size:13px;margin-top:2px;}
  .badge{background:var(--verde);color:#fff;font-size:13px;font-weight:600;border-radius:20px;padding:3px 11px;white-space:nowrap;}
  .chip{display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;margin-right:4px;line-height:1;vertical-align:middle;}
  .chip-lote{background:var(--verde-lite);color:var(--verde-esc);}
  .chip-f{background:#fbe9ef;color:#a13a63;} .chip-m{background:#e6eef6;color:#2f6fa8;}
  .chip-off{background:#eee;color:#777;} .chip-marca{background:#fff4d6;color:#8a6a12;}
  .chip-id{background:#eef2ef;color:#5a6b5e;}
  .avatar{width:64px;height:64px;border-radius:50%;background:var(--verde-lite);color:var(--verde);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;overflow:hidden;}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .avatar-wrap{position:relative;width:64px;height:64px;flex-shrink:0;cursor:pointer;}
  .avatar-cam{position:absolute;right:-3px;bottom:-3px;width:25px;height:25px;border-radius:50%;background:var(--verde);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;border:2px solid #fff;}
  .an-thumb{border-radius:10px;background:var(--verde-lite);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;font-size:18px;}
  .an-thumb img{width:100%;height:100%;object-fit:cover;}
  .fintabs{display:flex;gap:6px;margin:2px 0 14px;overflow-x:auto;}
  .fintabs button{flex:1;min-width:82px;padding:9px 6px;border:1.5px solid var(--linha);border-radius:10px;background:#fff;color:var(--muted);font-weight:600;font-size:13px;}
  .fintabs button.on{background:var(--verde);color:#fff;border-color:var(--verde);}
  .fin-hero{background:var(--verde-esc);color:#fff;border-radius:18px;padding:18px;margin-bottom:16px;}
  .fin-hero .lbl{opacity:.85;font-size:13px;} .fin-hero .num{font-size:32px;font-weight:800;margin-top:2px;}
  .fin-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;}
  .fin-c{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:12px;}
  .fin-c .cl{font-size:12px;color:var(--muted);} .fin-c .cv{font-size:17px;font-weight:800;margin-top:3px;}
  .fchart{display:flex;gap:3px;align-items:flex-end;height:130px;padding:6px 2px 0;}
  .fcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .fbars{display:flex;gap:1px;align-items:flex-end;height:100px;}
  .fbar{width:6px;border-radius:2px 2px 0 0;min-height:1px;}
  .fbar.rec{background:#4c9a5f;} .fbar.desp{background:var(--verde-esc);}
  .flbl{font-size:9px;color:var(--muted);}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:9999;padding:18px;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:12px;object-fit:contain;}
  .lightbox .lb-x{position:absolute;top:16px;right:18px;color:#fff;font-size:26px;opacity:.85;}
  .voltar{background:none;color:var(--verde-esc);font-weight:600;font-size:15px;padding:0;margin:2px 0 12px;}
  .h3{margin:18px 4px 10px;font-size:15px;color:var(--muted);font-weight:700;}
  .evt{border-left:3px solid var(--verde);padding:2px 0 12px 12px;margin-left:4px;}
  .evt:last-child{padding-bottom:0;}
  .evt .tp{font-weight:600;font-size:15px;} .evt .dt{color:var(--muted);font-size:12px;} .evt .de{font-size:14px;margin-top:2px;}
  .vazio{text-align:center;color:var(--muted);padding:36px 20px;} .vazio .big{font-size:34px;margin-bottom:8px;}

  /* ---------- Botões ---------- */
  button{font-family:inherit;font-size:16px;cursor:pointer;border:none;}
  .btn{display:block;width:100%;background:var(--verde);color:#fff;padding:14px;border-radius:14px;font-weight:600;margin-bottom:10px;box-shadow:var(--sombra);}
  .btn:active{background:var(--verde-med);}
  .btn-sec{background:#fff;color:var(--verde);border:1.5px solid var(--verde);box-shadow:none;}
  .btn-perigo{background:#fff;color:var(--perigo);border:1.5px solid var(--perigo);box-shadow:none;}
  .btn-fant{background:none;color:var(--muted);padding:10px;box-shadow:none;}
  .lado{display:flex;gap:12px;} .lado .btn{margin-bottom:0;}
  .cloud-card{background:#fff;border-radius:var(--radius);box-shadow:var(--sombra);padding:14px;margin-bottom:10px;}
  .cloud-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 9px;border-radius:18px;background:#eef2ef;color:#5a6b5e;}
  .cloud-status.on{background:var(--verde-lite);color:var(--verde-esc);}
  .cloud-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
  .cloud-grid .btn{margin:0;}
  .cloud-note{font-size:12px;color:var(--muted);line-height:1.4;margin-top:8px;}
  .animal-actions{margin-top:18px;margin-bottom:22px;}
  .animal-actions > .btn{margin-bottom:14px;}
  .animal-actions .lado{margin-bottom:12px;}
  .animal-actions .lado + .btn{margin-bottom:14px;}
  .animal-saida{margin-top:4px;margin-bottom:28px;}
  .manejo-hist{margin-top:26px;}
  .manejo-sec{background:#fff;border-radius:var(--radius);box-shadow:var(--sombra);padding:14px;margin-bottom:14px;}
  .manejo-sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
  .manejo-sec-title{font-size:16px;font-weight:800;color:var(--verde-esc);}
  .manejo-count{font-size:12px;color:var(--muted);font-weight:700;background:#f1f5f1;border-radius:20px;padding:3px 9px;}
  .manejo-reg{padding:10px 0;border-top:1px solid var(--linha);}
  .manejo-reg:first-of-type{border-top:0;padding-top:2px;}
  .manejo-reg .mr-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .manejo-reg .mr-title{font-weight:700;color:var(--texto);font-size:14px;}
  .manejo-reg .mr-date{font-size:12px;color:var(--muted);white-space:nowrap;}
  .manejo-reg .mr-meta{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.4;}

  /* ---------- Modal ---------- */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end;justify-content:center;}
  .ov.on{display:flex;}
  .modal{background:#fff;width:100%;max-width:660px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:sobe .18s ease;}
  @keyframes sobe{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
  .modal h2{margin:0 0 12px;font-size:18px;color:var(--verde-esc);}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px;font-weight:600;}
  input,select,textarea{width:100%;min-width:0;padding:12px;border:1.5px solid var(--linha);border-radius:10px;font-size:16px;font-family:inherit;background:#fff;color:var(--texto);}
  input[type="date"],input[type="time"]{-webkit-appearance:none;appearance:none;min-width:0;text-align:left;}
  input[type="date"]::-webkit-date-and-time-value,input[type="time"]::-webkit-date-and-time-value{text-align:left;margin:0;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--verde);}
  textarea{resize:vertical;min-height:60px;}
  .sheet-item{padding:15px 4px;border-bottom:1px solid var(--linha);font-size:16px;display:flex;gap:12px;align-items:center;}
  .sheet-item:last-child{border-bottom:none;} .sheet-item .si{color:var(--verde);font-size:20px;width:24px;text-align:center;}

  /* ---------- Nav ---------- */
  nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
    background:#fff;border-top:1px solid var(--linha);display:flex;z-index:30;box-shadow:0 -2px 10px rgba(20,40,25,.05);}
  nav button{flex:1;background:none;color:var(--muted);font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;line-height:1.08;padding:3px 2px;}
  nav button>span:last-child{max-width:86px;}
  nav button .ic{font-size:21px;line-height:1;} nav button.ativo{color:var(--verde);}
  .tile img{width:46px;height:46px;object-fit:contain;display:block;}
  .mic img{width:38px;height:38px;object-fit:contain;display:block;}
  nav .ic img{width:28px;height:24px;object-fit:contain;display:inline-block;vertical-align:middle;}

  /* ---------- Início / módulos principais ---------- */
  .home-title{margin:4px 4px 14px}
  .home-greet{margin:6px 4px 16px}
  .home-greet h2{margin:0;color:var(--verde-esc);font-size:25px;line-height:1.1;font-weight:800}
  .home-greet .hg-sub{margin-top:4px;font-size:15px;color:var(--muted)}
  .home-title h2{margin:0;color:var(--verde-esc);font-size:27px;line-height:1.05}
  .home-title .meta{margin-top:5px;font-size:15px}
  .home-module{background:linear-gradient(145deg,#fbfefb,#f0f8f2);border:1px solid #e4eee7;border-radius:20px;
    padding:16px;margin-bottom:14px;box-shadow:var(--sombra);cursor:pointer;}
  .home-module:active{transform:scale(.995)}
  .home-module-head{display:grid;grid-template-columns:76px 1fr 24px;align-items:center;gap:12px}
  .home-module-icon{width:76px;height:76px;border-radius:50%;background:#e4f3e8;display:flex;align-items:center;justify-content:center;
    font-size:39px;overflow:hidden}
  .home-module-icon img{width:68px;height:68px;object-fit:contain}
  .home-module .hm-title{font-size:21px;font-weight:800;color:var(--verde-esc);line-height:1.1}
  .home-module .hm-sub{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.35}
  .home-module .hm-chev{font-size:28px;color:var(--verde);font-weight:400;text-align:right}
  .home-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .home-stat{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:10px 8px;min-height:68px;
    display:flex;flex-direction:column;justify-content:center}
  .home-stat .hs-label{font-size:11px;color:var(--muted);line-height:1.15}
  .home-stat .hs-value{font-size:18px;font-weight:800;color:var(--verde-esc);margin-top:4px;line-height:1.1}
  .home-stat.neg .hs-value{color:var(--perigo)}
  .home-hint{background:#f3f7fb;border:1px solid #dce7f1;border-radius:17px;padding:14px 15px;margin-top:4px;
    display:flex;gap:12px;align-items:flex-start}
  .home-hint .hi-icon{width:34px;height:34px;border-radius:50%;background:#4e83b6;color:#fff;display:flex;align-items:center;
    justify-content:center;font-weight:800;flex-shrink:0}
  .home-hint b{color:#174d78;font-size:14px}
  .home-hint .meta{font-size:12px;margin-top:3px}
  @media(max-width:380px){
    .home-module-head{grid-template-columns:62px 1fr 18px}
    .home-module-icon{width:62px;height:62px}
    .home-module-icon img{width:56px;height:56px}
    .home-module .hm-title{font-size:18px}
    .home-stat .hs-value{font-size:16px}
  }
</style>
</head>
<body class="deslogado">

/*
  V50 — preparação para sincronização futura.
  O app continua 100% local/offline. Nenhuma conexão com nuvem foi adicionada.

  Metadados adicionados automaticamente aos registros:
  - created_at: criação local
  - updated_at: última alteração local
  - deleted_at: exclusão lógica (tombstone) para futura sincronização
  - sync_status: pending_create / pending_update / pending_delete / synced
  - sync_version: contador local de alterações

  A store "sync_meta" guarda somente dados técnicos deste aparelho e NÃO entra no backup.
*/
const SUPABASE_URL="https://qjpcccfexgxlykdzffpx.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_IgESM3xZNVXrAokEYIHzWw_fbrZqHDx";

const AUTH_STORAGE_KEY="rebanho_supabase_session";

function authSession(){
  try{return JSON.parse(localStorage.getItem(AUTH_STORAGE_KEY)||"null");}catch(e){return null;}
}
function saveAuthSession(s){
  if(s)localStorage.setItem(AUTH_STORAGE_KEY,JSON.stringify(s));
  else localStorage.removeItem(AUTH_STORAGE_KEY);
}
async function sbFetch(path,opt={}){
  const session=authSession();
  const headers=Object.assign({
    "apikey":SUPABASE_PUBLISHABLE_KEY,
    "Content-Type":"application/json"
  },opt.headers||{});
  if(session&&session.access_token)headers["Authorization"]="Bearer "+session.access_token;
  // V76: não permite que respostas GET da API sejam reaproveitadas pelo cache
  // HTTP do navegador. O service worker também ignora todo domínio externo.
  const res=await fetch(SUPABASE_URL+path,Object.assign({},opt,{headers,cache:"no-store"}));
  let body=null;
  const ct=res.headers.get("content-type")||"";
  try{body=ct.includes("application/json")?await res.json():await res.text();}catch(e){}
  if(res.status===401&&session&&session.refresh_token&&!opt._retry){
    const ok=await refreshAuthSession();
    if(ok)return sbFetch(path,Object.assign({},opt,{_retry:true}));
  }
  if(!res.ok){
    const msg=(body&&typeof body==="object"&&(body.msg||body.message||body.error_description||body.error))||String(body||("HTTP "+res.status));
    throw new Error(msg);
  }
  return body;
}
async function refreshAuthSession(){
  const s=authSession(); if(!s||!s.refresh_token)return false;
  try{
    const res=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=refresh_token",{
      method:"POST",
      headers:{"apikey":SUPABASE_PUBLISHABLE_KEY,"Content-Type":"application/json"},
      body:JSON.stringify({refresh_token:s.refresh_token})
    });
    if(!res.ok){saveAuthSession(null);return false;}
    const n=await res.json(); saveAuthSession(n); return true;
  }catch(e){return false;}
}
async function authUser(){
  const s=authSession(); if(!s)return null;
  if(s.user)return s.user;
  try{return await sbFetch("/auth/v1/user");}catch(e){return null;}
}

const DB="rebanho_v2";
const DB_VERSION=10;
const SYNC_SCHEMA_VERSION=4;
const DATA_STORES=["propriedades","marcas","lotes","animais","eventos","medicamentos","perfil","pastos","avisos","lancamentos","grupos","grupo_animais","insumos","insumo_mov"];
const SYNC_STORES=["propriedades","marcas","lotes","animais","eventos","medicamentos","pastos","avisos","lancamentos","grupos","grupo_animais","insumos","insumo_mov"];
let _syncRunning=false,_syncTimer=null,_syncLastError="",_syncLastResult=null;
let db;

const agoraISO=()=>new Date().toISOString();
const isoLegado=o=>{
  const ts=o&&(o.criadoEm||o.feitoEm);
  if(typeof ts==="number"&&Number.isFinite(ts))return new Date(ts).toISOString();
  return agoraISO();
};

function abrirDB(){return new Promise((ok,er)=>{const r=indexedDB.open(DB,DB_VERSION);
  r.onupgradeneeded=e=>{
    const d=e.target.result, t=e.target.transaction;
    const criar=n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:"id"});};
    DATA_STORES.forEach(criar);
    criar("sync_meta");

    // Migra registros antigos sem alterar os dados funcionais do usuário.
    // Todos ficam pendentes de criação para que, no futuro, possam ser enviados
    // ao primeiro backend configurado sem perder registros já existentes.
    for(const nome of DATA_STORES){
      const st=t.objectStore(nome);
      const req=st.openCursor();
      req.onsuccess=ev=>{
        const c=ev.target.result;
        if(!c)return;
        const o=c.value, base=o.created_at||isoLegado(o);
        let mudou=false;
        if(!o.created_at){o.created_at=base;mudou=true;}
        if(!o.updated_at){o.updated_at=base;mudou=true;}
        if(o.deleted_at===undefined){o.deleted_at=null;mudou=true;}
        if(!o.sync_status){o.sync_status="pending_create";mudou=true;}
        if(!Number.isFinite(o.sync_version)){o.sync_version=1;mudou=true;}
        if(mudou)c.update(o);
        c.continue();
      };
    }
  };
  r.onsuccess=async e=>{
    db=e.target.result;
    await garantirSyncMeta();
    ok();
  };
  r.onerror=er;
});}

function tx(s,m="readonly"){return db.transaction(s,m).objectStore(s);}
function getAllRaw(s){return new Promise((ok,er)=>{const r=tx(s).getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>er(r.error);});}
function getRaw(s,id){return new Promise((ok,er)=>{const r=tx(s).get(id);r.onsuccess=()=>ok(r.result);r.onerror=()=>er(r.error);});}
function putRaw(s,o){return new Promise((ok,er)=>{const r=tx(s,"readwrite").put(o);r.onsuccess=()=>ok(o);r.onerror=()=>er(r.error);});}
function hardDel(s,id){return new Promise((ok,er)=>{const r=tx(s,"readwrite").delete(id);r.onsuccess=()=>ok();r.onerror=()=>er(r.error);});}

async function activeOrgIdLocal(){
  try{const m=await getRaw("sync_meta","device");return m&&m.active_org_id||null;}catch(e){return null;}
}
async function getAll(s){
  const arr=await getAllRaw(s);
  const ativos=arr.filter(o=>!o.deleted_at);
  if(!SYNC_STORES.includes(s))return ativos;
  const org=await activeOrgIdLocal();
  if(!org)return ativos;
  return ativos.filter(o=>!o.organization_id||o.organization_id===org);
}
async function get(s,id){
  const o=await getRaw(s,id);
  if(!o||o.deleted_at)return undefined;
  if(SYNC_STORES.includes(s)){
    const org=await activeOrgIdLocal();
    if(org&&o.organization_id&&o.organization_id!==org)return undefined;
  }
  return o;
}
function agendarSync(ms=1800){
  if(!navigator.onLine||!authSession())return;
  clearTimeout(_syncTimer);
  _syncTimer=setTimeout(()=>sincronizarAgora({silencioso:true}),ms);
}
async function put(s,o){
  const agora=agoraISO();
  if(!o.created_at)o.created_at=agora;
  o.updated_at=agora;
  if(o.deleted_at===undefined)o.deleted_at=null;
  o.sync_version=(Number.isFinite(o.sync_version)?o.sync_version:0)+1;
  if(!o.sync_status)o.sync_status="pending_create";
  else if(o.sync_status==="synced")o.sync_status="pending_update";
  if(SYNC_STORES.includes(s)){
    const org=await activeOrgIdLocal();
    if(org&&!o.organization_id)o.organization_id=org;
  }
  const r=await putRaw(s,o);
  if(SYNC_STORES.includes(s))agendarSync();
  return r;
}
async function del(s,id){
  const o=await getRaw(s,id);
  if(!o)return;
  const agora=agoraISO();
  if(!o.created_at)o.created_at=agora;
  o.updated_at=agora;
  o.deleted_at=agora;
  o.sync_status="pending_delete";
  o.sync_version=(Number.isFinite(o.sync_version)?o.sync_version:0)+1;
  if(SYNC_STORES.includes(s)){
    const org=await activeOrgIdLocal();
    if(org&&!o.organization_id)o.organization_id=org;
  }
  const r=await putRaw(s,o);
  if(SYNC_STORES.includes(s))agendarSync();
  return r;
}
async function garantirSyncMeta(){
  let m=await getRaw("sync_meta","device");
  if(!m){
    m={id:"device",device_id:crypto.randomUUID?crypto.randomUUID():("dev-"+Date.now()+"-"+Math.random()),
      schema_version:SYNC_SCHEMA_VERSION,last_sync_at:null,last_server_sync_at:null,active_org_id:null,active_user_id:null,
      legacy_claimed_org_id:null,criado_em:agoraISO()};
    await putRaw("sync_meta",m);
  }else{
    let mudou=false;
    if(m.schema_version!==SYNC_SCHEMA_VERSION){m.schema_version=SYNC_SCHEMA_VERSION;mudou=true;}
    if(m.active_org_id===undefined){m.active_org_id=null;mudou=true;}
    if(m.active_user_id===undefined){m.active_user_id=null;mudou=true;}
    if(m.last_server_sync_at===undefined){m.last_server_sync_at=null;mudou=true;}
    if(m.legacy_claimed_org_id===undefined){m.legacy_claimed_org_id=null;mudou=true;}
    if(mudou)await putRaw("sync_meta",m);
  }
  return m;
}

async function registrarEvento(animalId,tipo,data,detalhes,extra){
  const a=await get("animais",animalId);
  const ev=Object.assign({id:uid(),animalId,tipo,data:data||hoje(),detalhes:detalhes||"",criadoEm:Date.now()}, extra||{});
  await put("eventos",ev);
  if(a&&(tipo==="Morte"||tipo==="Venda")){a.status=tipo==="Morte"?"Morto":"Vendido";await put("animais",a);}
}
async function excluirEvento(eventoId,animalId){
  if(!confirm("Excluir este registro do histórico?"))return;
  const ev=await get("eventos",eventoId);
  await del("eventos",eventoId);
  // se era registro de saída (morte/venda) e não sobrou outro, reativa o animal
  if(ev&&(ev.tipo==="Morte"||ev.tipo==="Venda")){
    const restantes=(await getAll("eventos")).filter(e=>e.animalId===animalId&&(e.tipo==="Morte"||e.tipo==="Venda"));
    if(!restantes.length){const a=await get("animais",animalId);if(a){a.status="Ativo";delete a.saida;await put("animais",a);}}
  }
  verAnimal(animalId);
}
async function moverAnimal(id,novoLote){
  const a=await get("animais",id),de=await get("lotes",a.loteAtualId),para=await get("lotes",novoLote);
  a.loteAtualId=novoLote;await put("animais",a);
  await registrarEvento(id,"Movimentação",hoje(),`De "${de?de.nome:"—"}" para "${para?para.nome:"—"}"`);
}

  pastos3m.forEach(x=>{const meses=Math.floor(x.d/30);

const mod=(ic,t,d,fn)=>`<div class="mod" onclick="${fn}"><div class="mic">${ic}</div>

/* ---------- Helpers de datas e histórico ---------- */
// Dias inteiros entre dois instantes (fim = agora, se não informado)
const diasEntre=(ini,fim)=>{if(!ini)return 0;return Math.max(0,Math.floor(((fim||Date.now())-ini)/86400000));};
// Timestamp -> "AAAA-MM-DD" no fuso local (compatível com fmt())
const tsData=ts=>{const d=new Date(ts);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0');};
// Lista com "Ver mais": mostra os 10 primeiros; o resto abre ao tocar.
let _vmN=0;
function verMais(itens,rotulo){
  if(!itens||!itens.length)return"";
  if(itens.length<=10)return itens.join("");
  const id="vm"+(++_vmN);
  return itens.slice(0,10).join("")
    +`<div id="${id}" style="display:none">${itens.slice(10).join("")}</div>`
    +`<button class="btn btn-sec" style="margin-top:10px" onclick="var e=document.getElementById('${id}');e.style.display='block';this.remove();">Ver mais ${itens.length-10}${rotulo?" "+rotulo:""}</button>`;
}

/* ---------- Histórico de situação do pasto ---------- */
// Reconstrói os períodos (fechados + o período atual em aberto)
function periodosPasto(pt){
  const hist=(pt.historico||[]).map(p=>({...p}));
  const aberto={status:pt.status||"Livre",inicio:pt.statusDesde||pt.criadoEm||Date.now(),fim:null,loteId:pt.loteId||null};
  return [...hist,aberto];
}
// Soma de dias por situação
function resumoPasto(pt){
  const d={Descanso:0,Ocupado:0,Livre:0};
  for(const p of periodosPasto(pt))d[p.status]=(d[p.status]||0)+diasEntre(p.inicio,p.fim);
  return d;
}
// Outros eventos registráveis no pasto (herbicida, roçada, etc.)
const PASTO_EVENTOS=["Herbicida","Roçada","Adubação","Calagem","Reforma / Plantio","Limpeza de cerca","Análise de solo","Outro"];
const ICONE_PASTO_EV={"Herbicida":"🧪","Roçada":"🌾","Adubação":"🌿","Calagem":"⚪","Reforma / Plantio":"🌱","Limpeza de cerca":"🚧","Análise de solo":"🔬","Outro":"📌"};
// "AAAA-MM-DD" -> timestamp local ao meio-dia (evita erro de fuso)
const dataParaTs=s=>{if(!s)return null;const[a,m,d]=s.split("-").map(Number);return new Date(a,(m||1)-1,d||1,12,0,0).getTime();};
// ---------- Desmama ----------
const DIAS_DESMAMA=210;
// Custo de formação atribuído a cada bezerro nascido na propriedade (ganho diferido).
const CUSTO_BEZERRO=500;
function desmamaInfo(a){
  if(a.desmamado)return {desmamado:true,dataDesmama:a.dataDesmama||""};
  if(!a.dataNascimento)return {desmamado:false,semData:true};
  const idade=diasEntre(dataParaTs(a.dataNascimento),Date.now());
  return {desmamado:false,idadeDias:idade,diasRestantes:DIAS_DESMAMA-idade};
}
function desmamaLabel(a){
  const d=desmamaInfo(a);
  if(d.desmamado)return `✅ Desmamado${d.dataDesmama?` em ${fmt(d.dataDesmama)}`:""}`;
  if(d.semData)return `🍼 Desmama: informe a data de nascimento`;
  if(d.diasRestantes>0)return `🍼 Desmama em ${d.diasRestantes} dia(s)`;
  if(d.diasRestantes===0)return `🍼 Desmama é hoje!`;
  return `⚠️ Desmama atrasada há ${-d.diasRestantes} dia(s)`;
}

  const naoDesmamados=animais.filter(a=>a.nascidoNaPropriedade===true&&!a.desmamado).sort((x,y)=>(x.codigo||0)-(y.codigo||0));

  abrir(`<h2>Registrar desmama</h2>

async function salvarDesmama(animalId){
  const id=animalId||(document.getElementById("dm_animal")||{}).value;
  if(!id)return alert("Selecione o bezerro.");
  const a=await get("animais",id);if(!a)return;
  const jaEra=a.desmamado;
  a.desmamado=true;a.dataDesmama=val("dm_data")||hoje();
  await put("animais",a);
  if(jaEra){
    const evs=(await getAll("eventos")).filter(e=>e.animalId===id&&e.tipo==="Desmama");
    if(evs.length){const ev=evs[0];ev.data=a.dataDesmama;await put("eventos",ev);}
  }else{
    await registrarEvento(id,"Desmama",a.dataDesmama,"Bezerro desmamado");
  }
  fechar();telaNascimentos();
}
async function desfazerDesmama(animalId){
  if(!confirm("Desfazer a desmama deste bezerro?"))return;
  const a=await get("animais",animalId);if(!a)return;
  a.desmamado=false;a.dataDesmama="";
  await put("animais",a);
  const evs=(await getAll("eventos")).filter(e=>e.animalId===animalId&&e.tipo==="Desmama");
  for(const ev of evs)await del("eventos",ev.id);
  telaNascimentos();
}

        <button class="btn-fant" style="padding:4px 8px;color:var(--perigo)" onclick="excluirPastoLista('${pt.id}')">✕</button></div>`:"";
    return `<div class="card">
      <div class="row"><div class="ti">${esc(pt.nome)}</div>${ctrl}</div>
      <div class="meta">${[pt.areaHa!=null?pt.areaHa+" ha":"",pt.tipoCapim].filter(Boolean).map(esc).join(" · ")||"—"}</div>
      <div class="meta" style="margin-top:6px">${pastoStatusChip(pt)}${pt.status==="Ocupado"&&pt.loteId?`<span class="chip chip-lote">▦ ${esc(nomeLote(pt.loteId))} · ${n} 🐄</span>`:""}</div>
      ${diasLinha?`<div class="meta" style="margin-top:8px">${diasLinha}</div>`:""}
      <button class="btn-fant" style="padding:8px 0 0;color:var(--verde);font-weight:600" onclick="verPasto('${pt.id}')">📋 Ver histórico ›</button></div>`;
  };
  let lst="";
  for(const pr of propriedades){
    const meus=pastos.filter(pt=>pt.propriedadeId===pr.id);
    if(!meus.length)continue;
    lst+=`<div class="h3">${esc(pr.nome)}</div>`+meus.map(cardPasto).join("");
  }
  const orfaos=pastos.filter(pt=>!propriedades.find(pr=>pr.id===pt.propriedadeId));
  if(orfaos.length)lst+=`<div class="h3">Sem propriedade</div>`+orfaos.map(cardPasto).join("");
  if(!pastos.length)lst=`<div class="vazio"><div class="big">🌱</div><b>Nenhum pasto cadastrado</b><div class="meta">Toque em "Novo pasto" para começar.</div></div>`;
  $t.innerHTML=`<button class="voltar" onclick="_editPastos=false;irAba('painel')">‹ Gestão Operacional</button>
    <div class="sechead"><span class="sic">🌱</span><h2>Gestão do Pasto</h2></div>
    <div class="lado"><button class="btn" onclick="formNovoPasto()">+ Novo pasto</button>
      ${pastos.length?`<button class="btn btn-sec" onclick="_editPastos=!_editPastos;telaGestaoPasto()">${_editPastos?"✓ Concluir":"✎ Editar"}</button>`:""}</div>
    ${_editPastos?`<div class="meta" style="margin:2px 4px 6px">Modo edição ligado — toque em ✎ para editar ou ✕ para excluir um pasto.</div>`:""}
    ${lst}`;
}
async function excluirPastoLista(id){
  const pt=await get("pastos",id);
  if(!confirm(`Apagar o pasto "${pt?pt.nome:""}"?`))return;
  await del("pastos",id); telaGestaoPasto();
}
async function verPasto(id){
  topoPagina();
  const pt=await get("pastos",id);
  if(!pt){telaGestaoPasto();return;}
  const {propriedades,lotes}=await tudo();
  const nomeLote=lid=>(lotes.find(l=>l.id===lid)||{}).nome||"—";
  const nomeProp=pid=>(propriedades.find(p=>p.id===pid)||{}).nome||"Sem propriedade";
  const r=resumoPasto(pt);
  const rot={Descanso:["🌿","Em descanso"],Ocupado:["🐄","Ocupado"],Livre:["⬜","Livre"]};
  // junta situações (períodos) + outros eventos, do mais recente ao mais antigo
  const entradas=[];
  (pt.historico||[]).forEach((p,i)=>entradas.push({kind:"per",ref:String(i),status:p.status,inicio:p.inicio,fim:p.fim,loteId:p.loteId,ordena:p.inicio||0}));
  entradas.push({kind:"per",ref:"atual",status:pt.status||"Livre",inicio:pt.statusDesde||pt.criadoEm||Date.now(),fim:null,loteId:pt.loteId||null,ordena:pt.statusDesde||pt.criadoEm||0});
  (pt.manejos||[]).forEach(m=>entradas.push({kind:"man",ref:m.id,tipo:m.tipo,data:m.data,obs:m.obs,ordena:dataParaTs(m.data)||0}));
  entradas.sort((a,b)=>b.ordena-a.ordena);
  const bE=fn=>`<button class="btn-fant" style="padding:2px 6px;color:var(--verde)" onclick="${fn}">✎</button>`;
  const bX=fn=>`<button class="btn-fant" style="padding:2px 6px;color:var(--perigo)" onclick="${fn}">✕</button>`;
  const itens=entradas.map(e=>{
    if(e.kind==="per"){
      const [ic,txt]=rot[e.status]||rot.Livre;
      const fimTxt=e.fim?fmt(tsData(e.fim)):"agora";
      const dias=diasEntre(e.inicio,e.fim);
      const loteTxt=(e.status==="Ocupado"&&e.loteId)?`▦ ${esc(nomeLote(e.loteId))}`:"";
      const ctrl=bE(`editarPeriodoPasto('${id}','${e.ref}')`)+(e.ref!=="atual"?bX(`excluirPeriodoPasto('${id}','${e.ref}')`):"");
      return `<div class="evt"><div class="row"><div class="tp">${ic} ${txt}</div><div style="white-space:nowrap">${ctrl}</div></div>
        <div class="dt">${fmt(tsData(e.inicio))} → ${fimTxt} · ${dias} dia(s)</div>${loteTxt?`<div class="de">${loteTxt}</div>`:""}</div>`;
    }else{
      const ic=ICONE_PASTO_EV[e.tipo]||"📌";
      const ctrl=bE(`formEventoPasto('${id}','${e.ref}')`)+bX(`excluirEventoPasto('${id}','${e.ref}')`);
      return `<div class="evt"><div class="row"><div class="tp">${ic} ${esc(e.tipo)}</div><div style="white-space:nowrap">${ctrl}</div></div>
        <div class="dt">${e.data?fmt(e.data):"—"}</div>${e.obs?`<div class="de">${esc(e.obs)}</div>`:""}</div>`;
    }
  });
  $t.innerHTML=`<button class="voltar" onclick="telaGestaoPasto()">‹ Gestão do Pasto</button>
    <div class="card"><div class="ti" style="font-size:19px">🌱 ${esc(pt.nome)}</div>
      <div class="meta">${esc(nomeProp(pt.propriedadeId))}${[pt.areaHa!=null?" · "+pt.areaHa+" ha":"",pt.tipoCapim?" · "+esc(pt.tipoCapim):""].join("")}</div>
      <div class="meta" style="margin-top:8px">${pastoStatusChip(pt)}${pt.status==="Ocupado"&&pt.loteId?`<span class="chip chip-lote">▦ ${esc(nomeLote(pt.loteId))}</span>`:""}</div></div>
    <div class="grid">
      <div class="card" style="text-align:center"><div style="font-size:30px;font-weight:800;color:var(--verde)">${r.Descanso}</div><div class="meta">dia(s) reservado<br>(em descanso)</div></div>
      <div class="card" style="text-align:center"><div style="font-size:30px;font-weight:800;color:var(--verde-esc)">${r.Ocupado}</div><div class="meta">dia(s) ocupado</div></div>
    </div>
    <button class="btn btn-sec" onclick="formEventoPasto('${id}')">+ Registrar evento no pasto</button>
    <div class="h3">Histórico</div>
    ${itens.length?verMais(itens,"registro(s)"):`<div class="meta">Sem registros ainda.</div>`}`;
}
/* ---------- Eventos do pasto (herbicida, roçada, etc.) ---------- */
async function formEventoPasto(pastoId,eventoId){
  const pt=await get("pastos",pastoId);
  const ev=(eventoId&&(pt.manejos||[]).find(m=>m.id===eventoId))||null;
  const optTipo=PASTO_EVENTOS.map((t,i)=>`<option value="${esc(t)}" ${ev?(ev.tipo===t?"selected":""):(i===0?"selected":"")}>${ICONE_PASTO_EV[t]||""} ${t}</option>`).join("");
  abrir(`<h2>${ev?"Editar evento":"Registrar evento no pasto"}</h2>
    <label>Tipo *</label><select id="ep_tipo">${optTipo}</select>
    <label>Data</label><input id="ep_data" type="date" value="${ev?ev.data:hoje()}">
    <label>Observação (opcional)</label><input id="ep_obs" value="${ev?esc(ev.obs||""):""}" placeholder="Ex: produto, dose, área…">
    <div class="lado" style="margin-top:18px"><button class="btn btn-sec" onclick="fechar()">Cancelar</button>
      <button class="btn" onclick="salvarEventoPasto('${pastoId}'${eventoId?`,'${eventoId}'`:""})">Salvar</button></div>`);
}
async function salvarEventoPasto(pastoId,eventoId){
  const pt=await get("pastos",pastoId);
  if(!pt.manejos)pt.manejos=[];
  const tipo=val("ep_tipo"),data=val("ep_data"),obs=val("ep_obs");
  if(eventoId){const m=pt.manejos.find(x=>x.id===eventoId);if(m){m.tipo=tipo;m.data=data;m.obs=obs;}}
  else pt.manejos.push({id:uid(),tipo,data,obs,criadoEm:Date.now()});
  await put("pastos",pt);fechar();verPasto(pastoId);
}
async function excluirEventoPasto(pastoId,eventoId){
  if(!confirm("Excluir este evento do histórico?"))return;
  const pt=await get("pastos",pastoId);
  pt.manejos=(pt.manejos||[]).filter(m=>m.id!==eventoId);
  await put("pastos",pt);verPasto(pastoId);
}
/* ---------- Editar/excluir situações (períodos) ---------- */
async function editarPeriodoPasto(pastoId,ref){
  const pt=await get("pastos",pastoId);
  const {lotes}=await tudo();
  const aberto=(ref==="atual");
  const per=aberto?{status:pt.status||"Livre",inicio:pt.statusDesde||pt.criadoEm||Date.now(),fim:null,loteId:pt.loteId||null}:(pt.historico||[])[Number(ref)];
  if(!per){verPasto(pastoId);return;}
  const optStatus=["Livre","Descanso","Ocupado"].map(s=>`<option value="${s}" ${per.status===s?"selected":""}>${s}</option>`).join("");
  const optLote=`<option value="">— nenhum —</option>`+lotes.map(l=>`<option value="${l.id}" ${per.loteId===l.id?"selected":""}>${esc(l.nome)}</option>`).join("");
  abrir(`<h2>Editar situação</h2>
    <label>Situação</label><select id="pp_status">${optStatus}</select>
    <label>Lote (se ocupado)</label><select id="pp_lote">${optLote}</select>
    <label>Início</label><input id="pp_ini" type="date" value="${tsData(per.inicio)}">
    ${aberto?`<div class="meta" style="margin-top:10px">Fim: <b>em aberto (agora)</b> — é a situação atual do pasto.</div>`:`<label>Fim</label><input id="pp_fim" type="date" value="${per.fim?tsData(per.fim):hoje()}">`}
    <div class="lado" style="margin-top:18px"><button class="btn btn-sec" onclick="fechar()">Cancelar</button>
      <button class="btn" onclick="salvarPeriodoPasto('${pastoId}','${ref}')">Salvar</button></div>`);
}
async function salvarPeriodoPasto(pastoId,ref){
  const pt=await get("pastos",pastoId);
  const status=val("pp_status");
  const loteId=status==="Ocupado"?(val("pp_lote")||null):null;
  const ini=dataParaTs(val("pp_ini"));
  if(ref==="atual"){
    pt.status=status;pt.loteId=loteId;if(ini)pt.statusDesde=ini;
  }else{
    const i=Number(ref);const arr=pt.historico||[];
    if(arr[i]){const fim=dataParaTs(val("pp_fim"));
      if(ini&&fim&&fim<ini){alert("A data de fim não pode ser anterior ao início.");return;}
      arr[i]={status,inicio:ini,fim,loteId};pt.historico=arr;}
  }
  await put("pastos",pt);fechar();verPasto(pastoId);
}
async function excluirPeriodoPasto(pastoId,ref){
  if(ref==="atual")return;
  if(!confirm("Excluir este período do histórico? Os dias contados serão recalculados."))return;
  const pt=await get("pastos",pastoId);
  const i=Number(ref);
  if((pt.historico||[])[i]){pt.historico.splice(i,1);await put("pastos",pt);}
  verPasto(pastoId);
}

        const cor=x.d<=0?"#c0392b":"var(--muted)";

    .sort((x,y)=>(x.data||"").localeCompare(y.data||"")||(x.hora||"").localeCompare(y.hora||""));
  const hojeTs=dataParaTs(hoje());
  const itensAviso=avisosCustom.map(a=>{
    const d=dataParaTs(a.data)!=null?Math.round((dataParaTs(a.data)-hojeTs)/86400000):null;
    const quando=d==null?"":(d>1?`em ${d} dias`:(d===1?"amanhã":(d===0?"hoje":`atrasado há ${-d} dia(s)`)));
    const cor=d==null?"var(--muted)":(d<0?"#c0392b":(d===0?"#b8860b":"var(--muted)"));
    return `<div class="card"><div class="row"><div class="ti" style="font-size:15px">${ICONE_AVISO[a.tipo]||"🔔"} ${esc(a.tipo)}</div>
        <div style="white-space:nowrap"><button class="btn-fant" style="padding:2px 6px;color:var(--verde)" onclick="formEditarAviso('${a.id}')">✎</button>
          <button class="btn-fant" style="padding:2px 6px;color:var(--perigo)" onclick="excluirAviso('${a.id}')">✕</button></div></div>
      ${a.detalhe?`<div class="meta">${esc(a.detalhe)}</div>`:""}
      <div class="meta" style="color:${cor};font-weight:600">📅 ${fmt(a.data)}${a.hora?` · ${esc(a.hora)}`:""}${quando?` · ${quando}`:""}</div>
      <button class="btn-fant" style="padding:6px 0 0;color:var(--verde);font-weight:600" onclick="marcarAvisoFeito('${a.id}')">✓ Marcar como concluído</button></div>`;
  });
  const blocoEventos=itensAviso.length
    ? `<div class="h3">📌 Próximos eventos</div>`+verMais(itensAviso,"evento(s)")
    : "";
  const podeNotif=("Notification" in window);
  const btnNotif=(podeNotif&&Notification.permission!=="granted")
    ? `<button class="btn btn-sec" onclick="ativarNotificacoes()">🔔 Ativar lembretes no celular</button>` : "";
  $t.innerHTML=`<button class="voltar" onclick="irAba('painel')">‹ Gestão Operacional</button>
    <div class="sechead"><span class="sic">🔔</span><h2>Avisos</h2></div>
    <button class="btn" onclick="formNovoAviso()">+ Cadastrar aviso</button>
    ${btnNotif}
    ${blocoEventos}
    ${blocoDesmama}
    ${bloco(descanso,"🌿 Pastos em descanso")}
    ${bloco(livres,"⬜ Pastos livres")}`;
}

async function formEditarAviso(id){const a=await get("avisos",id);if(a)formNovoAviso(a);}
async function salvarAviso(id){
  const tipo=val("av_tipo"), det=val("av_det"), data=val("av_data"), hora=val("av_hora");
  if(!det)return alert("Descreva o aviso.");
  if(!data)return alert("Escolha a data do evento.");
  if(id){const a=await get("avisos",id);if(a){a.tipo=tipo;a.detalhe=det;a.data=data;a.hora=hora;a.notificadoEm=null;await put("avisos",a);}}
  else await put("avisos",{id:uid(),tipo,detalhe:det,data,hora,feito:false,notificadoEm:null,criadoEm:Date.now()});
  fechar();telaAvisos();
}
async function excluirAviso(id){if(!confirm("Excluir este aviso?"))return;await del("avisos",id);telaAvisos();}
async function marcarAvisoFeito(id){const a=await get("avisos",id);if(a){a.feito=true;a.feitoEm=Date.now();await put("avisos",a);}telaAvisos();}
async function ativarNotificacoes(){
  if(!("Notification" in window))return alert("Este aparelho não suporta notificações no navegador.");
  try{const p=await Notification.requestPermission();
    if(p==="granted"){alert("Lembretes ativados! Ao abrir o app, você será avisado dos eventos do dia.");checarNotificacoes();}
    else alert("Permissão não concedida. Você ainda vê os eventos aqui na lista.");
  }catch(e){alert("Não foi possível ativar as notificações neste aparelho.");}
  telaAvisos();
}
async function checarNotificacoes(){
  if(!("Notification" in window)||Notification.permission!=="granted")return;
  const hojeStr=hoje(); const hojeTs=dataParaTs(hojeStr);
  const avisos=await getAll("avisos");
  const devidos=avisos.filter(a=>!a.feito&&dataParaTs(a.data)<=hojeTs&&a.notificadoEm!==hojeStr);
  if(!devidos.length)return;
  for(const a of devidos){a.notificadoEm=hojeStr;await put("avisos",a);}
  const corpo=devidos.map(a=>`${ICONE_AVISO[a.tipo]||"•"} ${a.tipo}: ${a.detalhe}`).join("\n");
  const titulo=devidos.length>1?`${devidos.length} avisos para hoje`:"Aviso do rebanho";
  try{
    const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();
    const opts={body:corpo,icon:"icon-192.png",badge:"icon-192.png",tag:"avisos-rebanho"};
    if(reg&&reg.showNotification)await reg.showNotification(titulo,opts);
    else new Notification(titulo,opts);
  }catch(e){}
}

function atualizarCriterioFiltroAnimais(){
  if(!_dadosAnimais)return;
  const tipo=(document.getElementById("f_tipo")||{}).value||"";
  const c=document.getElementById("f_criterio");if(!c)return;
  const {marcas,medicamentos,lotes,pastos,grupos}=_dadosAnimais;
  let opts=[];
  if(tipo==="marca"){
    opts=marcas.map(m=>[m.id,(m.sigla?m.sigla+" · ":"")+(m.nome||m.sigla||"Marca")]);
    opts.push(["__sem","Sem marca / dono"]);
  }else if(tipo==="med"){
    opts=medicamentos.map(m=>[m.id,m.nome||"Medicamento"]);opts.push(["__sem","Sem medicação registrada"]);
  }else if(tipo==="nasc"){
    opts=[["1","Último 1 mês"],["3","Últimos 3 meses"],["5","Últimos 5 meses"],["7","Últimos 7 meses"],["12","Últimos 12 meses"],["__sem","Sem data de nascimento"]];
  }else if(tipo==="grupo"){
    opts=grupos.map(g=>[g.id,g.nome||"Grupo"]);opts.push(["__sem","Sem grupo"]);
  }else if(tipo==="pasto"){
    opts=pastos.map(pt=>[pt.id,pt.nome||"Pasto"]);opts.push(["__sem","Sem pasto atual"]);
  }else if(tipo==="lote"){
    opts=lotes.map(l=>[l.id,l.nome||"Lote"]);opts.push(["__sem","Sem lote"]);
  }else if(tipo==="sexo"){
    opts=[["F","Fêmea"],["M","Macho"]];
  }else if(tipo==="status"){
    opts=[["Ativo","Ativo"],["Vendido","Vendido"],["Morto","Morto"]];
  }
  if(!tipo){c.innerHTML='<option value="">Primeiro escolha o tipo de filtro</option>';c.disabled=true;}
  else if(!opts.length){c.innerHTML='<option value="">Nenhuma opção cadastrada</option>';c.disabled=true;}
  else{c.innerHTML='<option value="">Escolha o critério</option>'+opts.map(([v,n])=>`<option value="${esc(v)}">${esc(n)}</option>`).join("");c.disabled=false;}
  filtrarAnimais();
}
function limparFiltrosAnimais(){
  const tipo=document.getElementById("f_tipo");if(tipo)tipo.value="";
  const c=document.getElementById("f_criterio");if(c){c.innerHTML='<option value="">Primeiro escolha o tipo de filtro</option>';c.value="";c.disabled=true;}
  const b=document.getElementById("busca");if(b)b.value="";
  filtrarAnimais();
}
function filtrarAnimais(){
  if(!_dadosAnimais)return;
  const {animais,nomeLote,marcaSigla,medPorAnimal,gruposPorAnimal,pastosPorLote}=_dadosAnimais;
  const t=(val("busca")||"").toLowerCase();
  const tipo=(document.getElementById("f_tipo")||{}).value||"";
  const criterio=(document.getElementById("f_criterio")||{}).value||"";
  let limite=null;
  if(tipo==="nasc"&&criterio&&criterio!=="__sem"){const d=new Date();d.setMonth(d.getMonth()-Number(criterio));limite=d.getTime();}
  const lista=animais.slice().sort((x,y)=>(x.codigo||0)-(y.codigo||0)).filter(a=>{
    if(t){const blob=((a.brinco||"")+" "+(a.nome||"")+" "+codAnimal(a)).toLowerCase();if(!blob.includes(t))return false;}
    if(!tipo||!criterio)return true;
    if(tipo==="marca")return criterio==="__sem"?!a.marcaId:a.marcaId===criterio;
    if(tipo==="med"){
      const s=medPorAnimal[a.id];return criterio==="__sem"?(!s||s.size===0):!!(s&&s.has(criterio));
    }
    if(tipo==="nasc"){
      if(criterio==="__sem")return !a.dataNascimento;
      if(!a.dataNascimento)return false;const dn=dataParaTs(a.dataNascimento);return dn!=null&&dn>=limite;
    }
    if(tipo==="grupo"){
      const s=gruposPorAnimal[a.id];return criterio==="__sem"?(!s||s.size===0):!!(s&&s.has(criterio));
    }
    if(tipo==="pasto"){
      const s=pastosPorLote[a.loteAtualId];return criterio==="__sem"?(!s||s.size===0):!!(s&&s.has(criterio));
    }
    if(tipo==="lote")return criterio==="__sem"?!a.loteAtualId:a.loteAtualId===criterio;
    if(tipo==="sexo")return a.sexo===criterio;
    if(tipo==="status")return a.status===criterio;
    return true;
  });
  const cont=document.getElementById("lista");
  if(cont)cont.innerHTML=lista.length?lista.map(a=>{a._marcaSigla=marcaSigla(a.marcaId);return linhaAnimal(a,nomeLote(a.loteAtualId),true);}).join(""):`<div class="meta" style="padding:12px 4px">Nenhum animal com esse filtro.</div>`;
  const cEl=document.getElementById("animais_count");if(cEl)cEl.textContent=`${lista.length} de ${animais.length} animal(is)`;
  const limpar=document.getElementById("limpar_filtros_animais");if(limpar)limpar.style.display=(t||tipo||criterio)?"block":"none";
}

        <div class="meta" style="margin-top:6px">${sx}${st}${idchip}${mostraLote?`<span class="chip chip-lote">▦ ${esc(nomeLote)}</span>`:""}

async function prepararContaLocal(){
  const user=await authUser(); if(!user)return null;
  const meta=await garantirSyncMeta();

  // Offline: mantém a organização previamente associada ao aparelho.
  if(!navigator.onLine){
    if(meta.active_user_id===user.id&&meta.active_org_id)return meta.active_org_id;
    return null;
  }

  const org=await cloudOrgId();
  meta.active_user_id=user.id;
  meta.active_org_id=org;

  // Na primeira adoção da V59, os dados antigos sem organização passam a
  // pertencer à primeira organização autenticada neste aparelho.
  if(!meta.legacy_claimed_org_id){
    for(const s of SYNC_STORES){
      const arr=await getAllRaw(s);
      for(const o of arr){
        if(!o.organization_id){
          o.organization_id=org;
          if(o.sync_status==="synced")o.sync_status="pending_update";
          else if(!o.sync_status)o.sync_status="pending_create";
          await putRaw(s,o);
        }
      }
    }
    meta.legacy_claimed_org_id=org;
  }

  await putRaw("sync_meta",meta);
  return org;
}

function payloadSync(o){
  const p={...o};
  delete p.sync_status;
  return p;
}
function cloudRecordToLocal(row){
  const p={...(row.payload||{})};
  p.id=p.id||row.record_id;
  p.organization_id=row.organization_id;
  p.updated_at=row.record_updated_at;
  p.deleted_at=row.deleted_at||null;
  p.sync_version=Number(row.sync_version||p.sync_version||1);
  p.sync_status="synced";
  return p;
}
function cloudMaisNovo(row,local){
  if(!local)return true;
  const ct=Date.parse(row.record_updated_at||0)||0;
  const lt=Date.parse(local.updated_at||0)||0;
  if(ct!==lt)return ct>lt;
  return Number(row.sync_version||0)>=Number(local.sync_version||0);
}
// Estritamente mais novo (usado para decidir o que rebaixar): evita reaplicar
// registros idênticos e não depende do relógio do servidor.
function cloudNewerStrict(row,local){
  if(!local)return true;
  const ct=Date.parse(row.record_updated_at||0)||0;
  const lt=Date.parse(local.updated_at||0)||0;
  if(ct!==lt)return ct>lt;
  return Number(row.sync_version||0)>Number(local.sync_version||0);
}

async function pushPendentes(org,user,device){
  let enviados=0,recebidos=0;
  for(const s of SYNC_STORES){
    const locais=(await getAllRaw(s)).filter(o=>
      o.organization_id===org && o.sync_status!=="synced"
    );
    if(!locais.length)continue;

    // Lotes pequenos evitam requisições muito grandes quando houver fotos/base64.
    for(let i=0;i<locais.length;i+=25){
      const lote=locais.slice(i,i+25);
      const body=lote.map(o=>({
        organization_id:org,
        store_name:s,
        record_id:String(o.id),
        payload:payloadSync(o),
        record_updated_at:o.updated_at||agoraISO(),
        deleted_at:o.deleted_at||null,
        sync_version:Number(o.sync_version||1),
        updated_by:user.id,
        source_device_id:device
      }));
      const resp=await sbFetch("/rest/v1/sync_records?on_conflict=organization_id,store_name,record_id",{
        method:"POST",
        headers:{"Prefer":"resolution=merge-duplicates,return=representation"},
        body:JSON.stringify(body)
      })||[];

      const mapa=new Map(resp.map(r=>[String(r.record_id),r]));
      for(const local of lote){
        const remoto=mapa.get(String(local.id));
        if(!remoto)continue;
        const atual=await getRaw(s,local.id);
        if(!atual)continue;

        if(cloudMaisNovo(remoto,atual) &&
           (Date.parse(remoto.record_updated_at||0)>Date.parse(atual.updated_at||0) ||
            Number(remoto.sync_version||0)>Number(atual.sync_version||0))){
          await putRaw(s,cloudRecordToLocal(remoto));
          recebidos++;
        }else{
          atual.organization_id=org;
          atual.sync_status="synced";
          await putRaw(s,atual);
        }
        enviados++;
      }
    }
  }
  return {enviados,recebidos};
}

async function pullCloud(org){
  /*
    V75: pull por reconciliação de conteúdo, independente de server_updated_at.

    Motivo: em tabelas padrão do Supabase, server_updated_at é definido no INSERT
    e NÃO muda no UPDATE (sem trigger). O pull incremental antigo (server_updated_at
    >= cursor) portanto NÃO enxergava EDIÇÕES feitas em outro aparelho — só
    inserções. Mover um animal de grupo/lote é uma edição, então não propagava.

    Agora, para cada store: baixamos um "manifesto" leve (só record_id +
    record_updated_at + sync_version + deleted_at, SEM payload/fotos), comparamos
    com o local pelo record_updated_at (que sempre avança a cada edição no app) e
    só baixamos o payload completo dos registros que realmente mudaram. Cobre
    inserções, edições e exclusões em TODAS as tabelas, sem depender do relógio
    do servidor e sem rebaixar fotos inalteradas.
  */
  let aplicados=0,consultados=0;
  const PAGE=500;
  for(const store of SYNC_STORES){
    // 1) Manifesto leve (paginado), só metadados.
    const remotos=[]; let offset=0;
    while(true){
      const path=
        "/rest/v1/sync_records?select=record_id,record_updated_at,deleted_at,sync_version"+
        "&organization_id=eq."+encodeURIComponent(org)+
        "&store_name=eq."+encodeURIComponent(store)+
        "&order=record_id.asc&limit="+PAGE+"&offset="+offset;
      const rows=await sbFetch(path)||[];
      remotos.push(...rows);
      offset+=rows.length;
      if(rows.length<PAGE)break;
    }
    consultados+=remotos.length;

    // 2) Decide quais precisam do payload completo (novos ou estritamente mais novos).
    const precisa=[];
    for(const r of remotos){
      const local=await getRaw(store,r.record_id);
      if(!local || cloudNewerStrict(r,local) ||
         (local.organization_id&&local.organization_id!==org)){
        precisa.push(String(r.record_id));
      }
    }
    if(!precisa.length)continue;

    // 3) Baixa o payload completo só dos que mudaram, em lotes.
    for(let i=0;i<precisa.length;i+=50){
      const ids=precisa.slice(i,i+50);
      const inList="("+ids.map(x=>'"'+x+'"').join(",")+")";
      const path=
        "/rest/v1/sync_records?select=organization_id,store_name,record_id,payload,record_updated_at,deleted_at,sync_version"+
        "&organization_id=eq."+encodeURIComponent(org)+
        "&store_name=eq."+encodeURIComponent(store)+
        "&record_id=in."+encodeURIComponent(inList);
      const rows=await sbFetch(path)||[];
      for(const row of rows){
        const local=await getRaw(store,row.record_id);
        const localDeOutraOrg=!!(local&&local.organization_id&&local.organization_id!==org);
        // Preserva alteração local pendente que seja mais nova que a nuvem.
        if(!local || localDeOutraOrg || local.sync_status==="synced" || cloudNewerStrict(row,local)){
          await putRaw(store,cloudRecordToLocal(row));
          aplicados++;
        }
      }
    }
  }
  // Mantém carimbo de tempo apenas para exibição; o pull não depende dele.
  const meta=await garantirSyncMeta();
  meta.last_server_sync_at=agoraISO();
  await putRaw("sync_meta",meta);
  return {aplicados,consultados,cursor:meta.last_server_sync_at};
}

async function marcarTudoSincronizado(org){
  // Depois do pull, itens iguais ao servidor já foram conciliados.
  // Mantém pendentes somente alterações que ocorreram durante a sincronização.
  for(const s of SYNC_STORES){
    const arr=await getAllRaw(s);
    for(const o of arr){
      if(o.organization_id!==org || o.sync_status==="synced")continue;
      // não força status aqui: um put simultâneo precisa continuar pendente
    }
  }
}

async function sincronizarAgora({silencioso=false}={}){
  if(_syncRunning)return _syncLastResult;
  if(!navigator.onLine){
    _syncLastError="Sem internet";
    if(!silencioso)alert("Sem internet. As alterações ficarão pendentes e serão sincronizadas quando a conexão voltar.");
    atualizarStatusSyncUI();
    return null;
  }
  const user=await authUser();
  if(!user){
    if(!silencioso)formLoginCloud();
    return null;
  }

  _syncRunning=true;_syncLastError="";
  atualizarStatusSyncUI("sincronizando");
  try{
    const org=await prepararContaLocal();
    if(!org)throw new Error("Não foi possível identificar a organização da conta.");
    const device=await cloudDeviceId();

    const push=await pushPendentes(org,user,device);
    const pull=await pullCloud(org);

    const meta=await garantirSyncMeta();
    meta.last_sync_at=agoraISO();
    meta.active_org_id=org;
    meta.active_user_id=user.id;
    await putRaw("sync_meta",meta);

    const totalAplicados=push.recebidos+pull.aplicados;
    _syncLastResult={...push,pull:pull.aplicados,consultados:pull.consultados,quando:meta.last_sync_at};
    atualizarStatusSyncUI("ok");

    // V74: atualiza automaticamente tanto a lista de grupos quanto o detalhe
    // do grupo que estiver aberto. Isso faz um novo vínculo aparecer na tela
    // assim que chegar de outro aparelho, sem fechar/reabrir o PWA.
    if(totalAplicados>0){
      const syncScreen=$t.dataset.syncScreen||"";
      if(syncScreen==="grupos")await telaGrupos();
      else if(syncScreen.startsWith("grupo:"))await verGrupo(syncScreen.slice(6));
    }

    if(!silencioso){
      alert(`Sincronização concluída.\nEnviados: ${push.enviados}\nRecebidos/aplicados: ${totalAplicados}`);
      // No Perfil, atualiza contadores/status. Nas subtelas, preserva a tela.
      if(aba==="perfil")await renderSeguro();
    }
    return _syncLastResult;
  }catch(e){
    _syncLastError=e.message||String(e);
    atualizarStatusSyncUI("erro");
    if(!silencioso)alert("Não foi possível sincronizar: "+_syncLastError);
    return null;
  }finally{
    _syncRunning=false;
  }
}

async function statusSync(){
  const meta=await garantirSyncMeta();
  let pendentes=0;
  if(meta.active_org_id){
    for(const s of SYNC_STORES){
      const arr=await getAllRaw(s);
      pendentes+=arr.filter(o=>o.organization_id===meta.active_org_id&&o.sync_status!=="synced").length;
    }
  }
  return {pendentes,last_sync_at:meta.last_sync_at,erro:_syncLastError};
}
async function atualizarStatusSyncUI(forcar=""){
  const el=document.getElementById("syncStatusBox"); if(!el)return;
  const st=await statusSync();
  if(forcar==="sincronizando"||_syncRunning){
    el.innerHTML=`<span class="cloud-status">↻ Sincronizando…</span>`;
    return;
  }
  if(forcar==="erro"||st.erro){
    el.innerHTML=`<span class="cloud-status" style="background:#fff2ee;color:var(--perigo)">⚠ Falha na sincronização</span>
      <div class="cloud-note">${esc(st.erro||"Tente novamente.")}</div>`;
    return;
  }
  const quando=st.last_sync_at?new Date(st.last_sync_at).toLocaleString("pt-BR"):"Ainda não sincronizado";
  el.innerHTML=`<span class="cloud-status ${st.pendentes===0?"on":""}">
      ${st.pendentes===0?"✓ Sincronizado":`${st.pendentes} pendente(s)`}
    </span><div class="cloud-note">${esc(quando)}</div>`;
}

let _ultimoAutoSync=0;
let _autoSyncInterval=null;
const AUTO_SYNC_INTERVAL_MS=30000;

function solicitarAutoSync(delay=350,{ignorarJanela=false}={}){
  // No iPhone não tentamos manter o app trabalhando em segundo plano.
  // Assim que ele volta a ficar visível, o visibilitychange/pageshow dispara
  // uma nova sincronização.
  if(document.visibilityState==="hidden"||!authSession()||!navigator.onLine||_syncRunning)return;
  const agora=Date.now();
  // Evita três sincronizações seguidas quando focus/pageshow/visibilitychange
  // disparam juntos ao voltar para o PWA. A sincronização periódica continua
  // livre para rodar a cada 30 s enquanto a tela estiver ativa.
  if(!ignorarJanela&&agora-_ultimoAutoSync<12000)return;
  _ultimoAutoSync=agora;
  clearTimeout(_syncTimer);
  _syncTimer=setTimeout(async()=>{
    try{
      await prepararContaLocal();
      await sincronizarAgora({silencioso:true});
      atualizarStatusSyncUI();
    }catch(e){
      _syncLastError=e.message||String(e);
      console.warn("Sincronização em segundo plano:",e);
      atualizarStatusSyncUI("erro");
    }
  },delay);
}

window.addEventListener("online",()=>solicitarAutoSync(300,{ignorarJanela:true}));
window.addEventListener("pageshow",()=>solicitarAutoSync(450));
window.addEventListener("focus",()=>solicitarAutoSync(450));
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible")solicitarAutoSync(300,{ignorarJanela:true});
});

function iniciarSyncEmSegundoPlano(){
  // A sincronização jamais participa do caminho crítico de abertura da interface.
  // Faz uma primeira tentativa logo após renderizar e, enquanto o PWA estiver
  // realmente aberto/visível, consulta alterações dos outros aparelhos a cada
  // 30 segundos. O intervalo não tenta executar quando o app está oculto.
  solicitarAutoSync(350,{ignorarJanela:true});
  if(_autoSyncInterval)clearInterval(_autoSyncInterval);
  _autoSyncInterval=setInterval(()=>{
    if(document.visibilityState==="visible"&&navigator.onLine&&authSession()){
      solicitarAutoSync(0,{ignorarJanela:true});
    }
  },AUTO_SYNC_INTERVAL_MS);
}

function perfilCloudParaLocal(cp,user){
  return {
    id:"perfil",
    user_id:user.id,
    nome:(cp&&cp.full_name)||((user.user_metadata||{}).full_name)||"",
    funcao:(cp&&cp.role_title)||"",

  };

async function sincronizarPerfilCloud(){
  const user=await authUser(); if(!user)return null;
  let local=await get("perfil","perfil");
  if(!navigator.onLine){
    if(local){local.email=user.email||local.email||"";return local;}
    return perfilCloudParaLocal(null,user);
  }
  try{
    const cp=await buscarPerfilCloud();
    const p=perfilCloudParaLocal(cp,user);
    await put("perfil",p);
    return p;
  }catch(e){
    if(local){local.email=user.email||local.email||"";return local;}
    return perfilCloudParaLocal(null,user);
  }
}
async function carregarPerfilIntegrado(user){
  const local=await get("perfil","perfil");

    local.email=user.email||local.email||"";
    return local;
  }
  return perfilCloudParaLocal(null,user);
}

function lerFotoRedimensionada(file,cb){
  const rd=new FileReader();
  rd.onload=e=>{const img=new Image();
    img.onload=()=>{let w=img.width,h=img.height;const max=400;
      if(w>h&&w>max){h=Math.round(h*max/w);w=max;}else if(h>max){w=Math.round(w*max/h);h=max;}
      const c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);cb(c.toDataURL("image/jpeg",0.82));};
    img.src=e.target.result;};
  rd.readAsDataURL(file);
}

async function finResumo(){
  if(!(await podeUsarApp("Acessar gestão financeira")))return;
  topoPagina();
  _finAno=_finAno||String(new Date().getFullYear());
  const {propriedades,lotes,animais}=await tudo();
  const nomeProp=id=>(propriedades.find(p=>p.id===id)||{}).nome||"—";
  const propDoAnimal=a=>{const l=lotes.find(x=>x.id===a.loteAtualId);return l?l.propriedadeId:null;};
  const todos=await getAll("lancamentos");
  const anos=[...new Set(todos.map(l=>(l.data||"").slice(0,4)).filter(Boolean))];
  if(!anos.includes(_finAno))anos.push(_finAno);
  anos.sort().reverse();
  const lancs=todos.filter(l=>(l.data||"").slice(0,4)===_finAno&&(!_finProp||l.propriedadeId===_finProp));
  const rec=lancs.filter(l=>l.tipo==="receita").reduce((s,l)=>s+(l.valor||0),0);
  const cpv=lancs.filter(l=>l.tipo==="receita").reduce((s,l)=>s+(l.custo||0),0);
  const desp=lancs.filter(l=>l.tipo==="despesa").reduce((s,l)=>s+(l.valor||0),0);
  const ganhoReal=lancs.filter(l=>l.tipo==="receita").reduce((s,l)=>s+(l.ganhoRealizado||0),0);
  const resultado=rec-cpv-desp+ganhoReal;
  const aReceber=lancs.filter(l=>l.tipo==="receita"&&!l.pago).reduce((s,l)=>s+(l.valor||0),0);
  const aPagar=lancs.filter(l=>l.tipo==="despesa"&&!l.pago).reduce((s,l)=>s+(l.valor||0),0)
    +(await getAll("insumo_mov")).filter(m=>m.tipo==="entrada"&&!m.pago).reduce((s,m)=>s+(m.valorTotal||0),0);
  // valor do rebanho (estoque) = custo de estoque dos animais ativos
  const valorRebanho=animais.filter(a=>a.status==="Ativo"&&(!_finProp||propDoAnimal(a)===_finProp))
    .reduce((s,a)=>s+(a.custoEstoque||0),0);
  const porMes=Array.from({length:12},()=>({rec:0,cust:0}));
  for(const l of lancs){const m=parseInt((l.data||"").slice(5,7),10)-1;if(m>=0&&m<12){
    if(l.tipo==="receita"){porMes[m].rec+=l.valor||0;porMes[m].cust+=l.custo||0;}
    else porMes[m].cust+=l.valor||0;}}
  const maxMes=Math.max(1,...porMes.map(m=>Math.max(m.rec,m.cust)));
  const chart=`<div class="fchart">${porMes.map((m,i)=>`<div class="fcol"><div class="fbars">
      <div class="fbar rec" style="height:${Math.round(m.rec/maxMes*100)}%"></div>
      <div class="fbar desp" style="height:${Math.round(m.cust/maxMes*100)}%"></div>
    </div><div class="flbl">${MESES_ABREV[i]}</div></div>`).join("")}</div>`;
  let porProp="";
  if(!_finProp){
    const map={};
    for(const l of lancs){const k=l.propriedadeId||"__";const v=l.tipo==="receita"?((l.valor||0)-(l.custo||0)):-(l.valor||0);map[k]=(map[k]||0)+v;}
    const linhas=Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="card row" style="cursor:default"><div class="ti" style="font-size:15px">🏠 ${k==="__"?"Sem propriedade":esc(nomeProp(k))}</div><div style="font-weight:800;color:${v>=0?'var(--verde)':'var(--perigo)'}">${moeda(v)}</div></div>`).join("");
    porProp=`<div class="h3">Resultado por propriedade</div>${linhas||`<div class="meta">Sem lançamentos.</div>`}`;
  }
  const optProp=`<option value="">Todas as propriedades</option>`+propriedades.map(p=>`<option value="${p.id}" ${_finProp===p.id?"selected":""}>${esc(p.nome)}</option>`).join("");
  const optAno=anos.map(a=>`<option value="${a}" ${_finAno===a?"selected":""}>${a}</option>`).join("");
  $t.innerHTML=`${finHead()}${finTabsBar("resumo")}
    <div class="lado" style="margin-bottom:14px">
      <select onchange="_finProp=this.value;finResumo()">${optProp}</select>
      <select onchange="_finAno=this.value;finResumo()" style="max-width:110px">${optAno}</select>
    </div>
    <div class="fin-hero"><div class="lbl">Resultado de ${_finAno}${_finProp?" · "+esc(nomeProp(_finProp)):""} (competência)</div>
      <div class="num">${moeda(resultado)}</div>
      <div class="lbl" style="margin-top:2px">receita − CPV − despesas · ${resultado>=0?"lucro":"prejuízo"} no período</div></div>
    <div class="fin-cards">
      <div class="fin-c"><div class="cl">💰 Receita de vendas</div><div class="cv" style="color:var(--verde)">${moeda(rec)}</div></div>
      <div class="fin-c"><div class="cl">🐂 CPV (custo dos vendidos)</div><div class="cv" style="color:var(--perigo)">${moeda(cpv)}</div></div>
      <div class="fin-c"><div class="cl">🧾 Despesas</div><div class="cv" style="color:var(--perigo)">${moeda(desp)}</div></div>
      <div class="fin-c"><div class="cl">🐄 Valor do rebanho</div><div class="cv">${moeda(valorRebanho)}</div></div>
      <div class="fin-c"><div class="cl">⏳ A receber</div><div class="cv">${moeda(aReceber)}</div></div>
      <div class="fin-c"><div class="cl">📌 A pagar</div><div class="cv">${moeda(aPagar)}</div></div>
    </div>
    <button class="btn" onclick="formLancamento()">+ Novo lançamento</button>
    <div class="h3">Evolução mensal <span style="font-weight:400;font-size:12px;color:var(--muted)">· receita e custos+despesas</span></div>
    <div class="card" style="padding:10px">${chart}</div>
    ${porProp}`;
}

  const pago=(document.getElementById("lc_pago")||{}).value==="1";
  const prop=val("lc_prop")||null, desc=val("lc_desc");
  if(id){const l=await get("lancamentos",id);if(l){Object.assign(l,{tipo,categoria,valor,data,propriedadeId:prop,descricao:desc,pago});await put("lancamentos",l);}}
  else await put("lancamentos",{id:uid(),tipo,categoria,valor,data,propriedadeId:prop,descricao:desc,pago,origem:"manual",refId:null,criadoEm:Date.now()});
  fechar();finLancamentos();
}
async function excluirLancamento(id){if(!confirm("Excluir este lançamento?"))return;await del("lancamentos",id);finLancamentos();}
async function toggleLancPago(id){const l=await get("lancamentos",id);if(l){l.pago=!l.pago;l.dataPagamento=l.pago?hoje():null;await put("lancamentos",l);}finLancamentos();}

async function finRelatorios(){
  if(!(await podeUsarApp("Acessar relatórios financeiros")))return;
  topoPagina();
  _finAno=_finAno||String(new Date().getFullYear());
  const {propriedades,lotes,animais}=await tudo();
  const propDoAnimal=a=>{const l=lotes.find(x=>x.id===a.loteAtualId);return l?l.propriedadeId:null;};
  const todos=await getAll("lancamentos");
  const insumos=await getAll("insumos");
  const movsIns=await getAll("insumo_mov");
  const estoqueInsumos=insumos.reduce((s,i)=>s+(i.saldo||0)*(i.custoMedio||0),0);
  const aPagarInsumos=(!_finProp)?movsIns.filter(m=>m.tipo==="entrada"&&!m.pago).reduce((s,m)=>s+(m.valorTotal||0),0):0;
  const lancs=todos.filter(l=>(l.data||"").slice(0,4)===_finAno&&(!_finProp||l.propriedadeId===_finProp));
  const rec=lancs.filter(l=>l.tipo==="receita").reduce((s,l)=>s+(l.valor||0),0);
  const cpv=lancs.filter(l=>l.tipo==="receita").reduce((s,l)=>s+(l.custo||0),0);
  const desp=lancs.filter(l=>l.tipo==="despesa").reduce((s,l)=>s+(l.valor||0),0);
  const ganhoReal=lancs.filter(l=>l.tipo==="receita").reduce((s,l)=>s+(l.ganhoRealizado||0),0);
  const resultado=rec-cpv-desp+ganhoReal;
  const estoque=animais.filter(a=>a.status==="Ativo"&&(!_finProp||propDoAnimal(a)===_finProp)).reduce((s,a)=>s+(a.custoEstoque||0),0);
  // Ganho a realizar (passivo): bezerros nascidos ainda no estoque (vivos)
  const ganhoAReceber=animais.filter(a=>a.nascidoNaPropriedade===true&&a.status==="Ativo"&&(!_finProp||propDoAnimal(a)===_finProp)).reduce((s,a)=>s+(a.custoEstoque||0),0);
  const aReceber=todos.filter(l=>l.tipo==="receita"&&!l.pago&&(!_finProp||l.propriedadeId===_finProp)).reduce((s,l)=>s+(l.valor||0),0);
  const aPagar=todos.filter(l=>l.tipo==="despesa"&&!l.pago&&(!_finProp||l.propriedadeId===_finProp)).reduce((s,l)=>s+(l.valor||0),0)+aPagarInsumos;
  const linhaDRE=(lbl,v,cor)=>`<div class="card row" style="cursor:default"><div class="ti" style="font-size:14px">${lbl}</div><div style="font-weight:800;color:${cor||'var(--texto)'}">${moeda(v)}</div></div>`;
  const porCat=(tipo)=>{
    const map={};
    for(const l of lancs.filter(x=>x.tipo===tipo))map[l.categoria]=(map[l.categoria]||0)+(l.valor||0);
    const arr=Object.entries(map).sort((a,b)=>b[1]-a[1]);
    if(!arr.length)return `<div class="meta" style="padding:2px 4px 8px">Sem ${tipo==="receita"?"receitas":"despesas"} no período.</div>`;
    const tot=arr.reduce((s,[,v])=>s+v,0);
    return arr.map(([c,v])=>`<div class="card row" style="cursor:default"><div class="ti" style="font-size:14px">${esc(c)}</div><div style="text-align:right"><div style="font-weight:800;color:${tipo==="receita"?'var(--verde)':'var(--perigo)'}">${moeda(v)}</div><div class="meta">${tot?Math.round(v/tot*100):0}%</div></div></div>`).join("");
  };
  // Partidas dobradas do período
  const partidasDe=l=>{const out=[];const contra=l.pago?"Banco/Caixa":(l.tipo==="receita"?"Clientes (a receber)":"Fornecedores (a pagar)");
    if(l.tipo==="receita"){out.push([contra,"Receita de vendas",l.valor||0]);
      if((l.custo||0)>0)out.push(["CPV","Estoque de semoventes",l.custo]);
      if((l.ganhoRealizado||0)>0)out.push(["Ganho a realizar – semoventes","Ganho realizado com semoventes",l.ganhoRealizado]);}
    else if(l.origem==="consumo_insumo")out.push(["Despesas","Estoque de insumos",l.valor||0]);
    else out.push(["Despesas",contra,l.valor||0]);return out;};
  const eventos=[];
  lancs.forEach(l=>eventos.push({data:l.data,desc:l.descricao||l.categoria,partidas:partidasDe(l)}));
  // Nascimentos do período: D Estoque de Semoventes / C Ganho a realizar
  animais.filter(a=>a.nascidoNaPropriedade===true&&(a.dataNascimento||"").slice(0,4)===_finAno&&(a.custoEstoque||0)>0&&(!_finProp||propDoAnimal(a)===_finProp))
    .forEach(a=>eventos.push({data:a.dataNascimento,desc:`Nascimento ${rotulo(a)} ${codAnimal(a)}`,
      partidas:[["Estoque de semoventes","Ganho a realizar – semoventes",a.custoEstoque||0]]}));
  // Compras de insumo do período (entradas): D Estoque de insumos / C Banco ou Fornecedores
  if(!_finProp){
    const nomeIns=id=>(insumos.find(i=>i.id===id)||{}).nome||"insumo";
    movsIns.filter(m=>m.tipo==="entrada"&&(m.data||"").slice(0,4)===_finAno)
      .forEach(m=>eventos.push({data:m.data,desc:`Compra ${nomeIns(m.insumoId)}`,
        partidas:[["Estoque de insumos",m.pago?"Banco/Caixa":"Fornecedores (a pagar)",m.valorTotal||0]]}));
  }
  const razao=eventos.sort((a,b)=>(b.data||"").localeCompare(a.data||"")).map(ev=>`<div class="card" style="cursor:default">
    <div class="meta">${fmt(ev.data)} · ${esc(ev.desc)}</div>
    ${ev.partidas.map(([d,c,v])=>`<div style="display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-top:3px"><span>D <b>${d}</b> / C <b>${c}</b></span><span style="white-space:nowrap;font-weight:700">${moeda(v)}</span></div>`).join("")}</div>`);
  $t.innerHTML=`${finHead()}${finTabsBar("relatorios")}
    <div class="meta" style="margin:0 4px 12px">Ano ${_finAno}${_finProp?"":" · todas as propriedades"}</div>
    <div class="h3">Resultado do período (competência)</div>
    ${linhaDRE("Receita de vendas",rec,"var(--verde)")}
    ${linhaDRE("(−) CPV — custo dos vendidos",-cpv,"var(--perigo)")}
    ${ganhoReal>0?linhaDRE("(+) Ganho realizado (bezerros vendidos)",ganhoReal,"var(--verde)"):""}
    ${linhaDRE("(=) Margem bruta do rebanho",rec-cpv+ganhoReal,rec-cpv+ganhoReal>=0?"var(--verde)":"var(--perigo)")}
    ${linhaDRE("(−) Despesas do período",-desp,"var(--perigo)")}
    ${linhaDRE("(=) Resultado",resultado,resultado>=0?"var(--verde)":"var(--perigo)")}
    <div class="h3">Posição atual (patrimônio)</div>
    ${linhaDRE("🐄 Estoque de semoventes (valor do rebanho)",estoque)}
    ${estoqueInsumos>0?linhaDRE("📦 Estoque de insumos",estoqueInsumos):""}
    ${ganhoAReceber>0?linhaDRE("🍼 Ganho a realizar (bezerros no estoque)",ganhoAReceber,"var(--muted)"):""}
    ${linhaDRE("⏳ Clientes — a receber",aReceber)}
    ${linhaDRE("📌 Fornecedores — a pagar",aPagar)}
    <div class="h3">Receitas por categoria</div>${porCat("receita")}
    <div class="h3">Despesas por categoria</div>${porCat("despesa")}
    <div class="h3">Partidas do período (débito / crédito)</div>
    ${razao.length?verMais(razao,"lançamento(s)"):`<div class="meta" style="padding:2px 4px 8px">Sem lançamentos no período.</div>`}`;
}

/* ======================= ESTOQUE DE INSUMOS ======================= */
function catsDoGrupo(g){return g==="manutencao"?CAT_INSUMO_MANUT:CAT_INSUMO_GADO;}
const numFmt=n=>Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:3});

async function telaEstoque(){
  if(!(await podeUsarApp("Estoque de insumos")))return;
  topoPagina();
  const insumos=(await getAll("insumos")).sort((a,b)=>(a.nome||"").localeCompare(b.nome||""));

  const valorTotal=insumos.reduce((s,i)=>s+(i.saldo||0)*(i.custoMedio||0),0);
  const aPagarIns=movs.filter(m=>m.tipo==="entrada"&&!m.pago).reduce((s,m)=>s+(m.valorTotal||0),0);
  const bloco=(gkey,gnome,gic)=>{
    const itens=insumos.filter(i=>i.grupo===gkey);
    const linhas=itens.length?itens.map(i=>{
      const vv=(i.saldo||0)*(i.custoMedio||0);
      const baixo=(i.saldo||0)<=0;
      return `<div class="card">
        <div class="row"><div class="ti" style="font-size:15px">${esc(i.nome)}</div>
