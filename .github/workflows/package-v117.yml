name: Package V117
on:
  push:
    paths:
      - '.github/workflows/package-v117.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove GitHub metadata from package
        run: rm -rf .git .github
      - name: Build ZIP
        run: zip -r gestao-rebanho-v117.zip .
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: gestao-rebanho-v117
          path: gestao-rebanho-v117.zip
          retention-days: 1
