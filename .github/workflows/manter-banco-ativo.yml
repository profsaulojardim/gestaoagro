# Gestão do Rebanho — mantém o banco do Supabase ativo.
# No plano gratuito o Supabase pausa o projeto depois de 7 dias sem consultas reais ao banco.
# Esta tarefa roda todo dia (~6h15 de Brasília) e chama a função public.manter_ativo(), que só
# responde 'ok' (não lê nem grava dados). Ela precisa existir no banco — criar uma vez no
# SQL Editor do Supabase (ver ARQUITETURA.md, seção "Manter o banco ativo").
# Uma resposta de "acesso negado" (401) NÃO conta como uso para o Supabase: por isso só 200 é sucesso.
# Endereço e chave são lidos de js/app/01-config-conta.js: o mesmo arquivo serve para o app de
# teste e para o de produção (cada um consulta o próprio banco).
# Rodar na mão: aba Actions › "Manter banco ativo" › Run workflow.
name: Manter banco ativo

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia, 09:17 UTC = 06:17 em Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: js/app/01-config-conta.js
          sparse-checkout-cone-mode: false

      - name: Consultar o banco
        run: |
          set +e
          URL=$(grep -oP 'SUPABASE_URL="\K[^"]+' js/app/01-config-conta.js)
          KEY=$(grep -oP 'SUPABASE_PUBLISHABLE_KEY="\K[^"]+' js/app/01-config-conta.js)
          echo "Banco: $URL"
          for tentativa in 1 2 3; do
            CODIGO=$(curl -s -o resposta.txt -w "%{http_code}" --max-time 30 -X POST \
              "$URL/rest/v1/rpc/manter_ativo" \
              -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
            ERRO_CURL=$?
            echo "Tentativa $tentativa: HTTP $CODIGO (curl $ERRO_CURL) — $(head -c 200 resposta.txt 2>/dev/null)"
            if [ "$CODIGO" = "200" ]; then echo "Banco ativo."; exit 0; fi
            if [ "$CODIGO" = "404" ]; then
              echo "::error::A função manter_ativo() não existe no banco. Crie-a no SQL Editor do Supabase (ver ARQUITETURA.md)."
              exit 1
            fi
            sleep 20
          done
          if [ "$ERRO_CURL" = "6" ]; then
            echo "::error::Endereço do banco não encontrado: o projeto do Supabase está PAUSADO. Entre em supabase.com e clique em Resume project."
          else
            echo "::error::O banco não respondeu. Veja se o projeto está pausado em supabase.com."
          fi
          exit 1
